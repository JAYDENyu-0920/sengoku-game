<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#151c19"><title>戰國群雄錄｜戰棋試玩 D1</title><link rel="stylesheet" href="./style.css"></head><body>
<header><div class="brand"><span class="crest">◆</span><div><small>戰國群雄錄 · B1</small><h1>戰術會戰 <em>試玩版 D2</em></h1></div></div><button id="reset" class="outline">重新開戰</button></header>
<main><section class="battlefield"><div class="status"><span id="round">第 1 輪</span><span id="turn">攻方行動</span><span id="phase">戰鬥中</span></div><div class="mapwrap"><svg id="map" role="img" aria-label="十乘十六角格戰棋地圖" viewBox="0 0 835 555"></svg></div><div class="legend"><span>🔵 攻方</span><span>🔴 守方</span><span>🟡 可移動</span><span>⚔ 可攻擊</span></div></section><aside><section class="panel"><h2>部隊資訊</h2><div id="unitInfo" class="info">點選我方部隊以查看資訊</div></section><section class="panel command-panel"><h2>快捷指令</h2><div class="controls"><button id="attack">選擇攻擊目標</button><button id="reload">鐵砲裝填</button><button id="end">結束部隊行動</button><button id="pass">放棄反應</button></div><p id="help" class="hint" aria-live="polite">點選輪到的一方部隊即可啟動並顯示移動範圍。</p></section><section class="panel"><h2>戰鬥紀錄</h2><div id="log" class="log" aria-live="polite"></div></section></aside></main>
<div id="attackConfirm" class="confirm" hidden><div class="confirm-card"><strong id="attackPreview">確認攻擊？</strong><div class="confirm-actions"><button id="confirmCancel" class="outline">取消</button><button id="confirmAttack">確認攻擊</button></div></div></div><footer>獨立試玩場景 · 不讀取或修改大地圖存檔 · D2 尚未整合 AI 與戰後永久結算</footer><script type="module" src="./ui.mjs"></script></body></html>
