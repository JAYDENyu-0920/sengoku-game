 const loss=Math.round(unitTotal(send)*(chance/100*winLoss+(1-chance/100)*loseLoss));
 return {atk,def,chance,loss,send,commander,defender,traitAttack:atkTrait.desc,traitDefense:defTrait.desc};
}

function battle(a,b,n,config={}){
 const x=g.cities[a],y=g.cities[b];
 if(!x||!y||x.owner===y.owner||!nearby(a).includes(b)||peaceful(x.owner,y.owner))return false;
 const tactic=TACTICS[config.tactic]||TACTICS.balanced;
 const commander=officerForBattle(x,config.commander);
 const defender=officer(y.officer);
 n=Math.min(Math.max(0,Math.floor(n)),x.troops);
 if(n<100)return false;
 const send=allocatedArmy(x,n);
 n=unitTotal(send);
 if(n<100)return false;
 const defenseUnits={...y.units},defenderBefore=unitTotal(defenseUnits);
 const estimate=battleEstimate(a,b,n,config);
 const atk=estimate.atk*(.90+Math.random()*.20);
 const def=estimate.def*(.90+Math.random()*.20);
 const success=atk>def;
 const attackerLoss=Math.min(.93,Math.max(.19,(success?.30:.66)*tactic.loss*(def/Math.max(atk,1))**.20));
 const defenderLoss=Math.min(.96,Math.max(.12,(success?.83:.35)*(atk/Math.max(def,1))**.16));
 for(const k of ['foot','horse','gun']){
  x.units[k]-=send[k];
  const survivors=Math.round(send[k]*(1-attackerLoss));
  if(success)y.units[k]=survivors;
  else x.units[k]+=survivors;
  if(!success)y.units[k]=Math.max(0,Math.round(y.units[k]*(1-defenderLoss)));
 }
 const walls=Math.round((success?18:config.tactic==='siege'?19:8)*tactic.wall);
 y.def=Math.max(10,y.def-walls);
 y.siege=success?0:Math.min(100,y.siege+walls);
 y.morale=success?Math.max(45,Math.round(x.morale-8)):Math.max(20,y.morale-12);
 x.morale=Math.max(25,x.morale-(success?5:13));
 if(success){
  const old=y.officer,former=y.owner;
  y.owner=x.owner;y.officer=0;
  if(old&&g.personnel[old]){
   g.personnel[old].faction='浪人';g.personnel[old].loyalty=0;
   g.reserve=g.reserve.filter(id=>id!==old);
  }
  log('⚔ '+commander.n+'以'+tactic.name+'攻陷'+y.name+'城（原'+former+'家）；新駐軍'+unitTotal(y.units)+'人');
 }else log('⚔ '+commander.n+'以'+tactic.name+'攻打'+y.name+'失利；城防降至'+Math.round(y.def)+'，攻城進度'+y.siege);
 x.troops=unitTotal(x.units);y.troops=unitTotal(y.units);
 if(config.commander&&g.personnel[config.commander])g.personnel[config.commander].xp+=(success?10:4);
 g.war.last={turn:g.turn,from:x.name,to:y.name,commander:commander.n,tactic:tactic.name,success,attack:n,attackLost:Math.round(n*attackerLoss),defendLost:Math.round(defenderBefore*defenderLoss),walls:y.def,siege:y.siege,winChance:estimate.chance,trait:estimate.traitAttack};
 return true;
}

function diplomacyAction(type){if(!ready())return;let el=document.getElementById('diplomacyTarget');if(!el)return;let target=el.value;selectedTarget('diplomacyTarget');if(!FACTIONS.includes(target)||target==='織田'||!g.cities.some(c=>c.owner===target))return alert('無效的外交對象');let rel=relation('織田',target),key=pair('織田',target),cost={improve:200,alliance:500,truce:300,break:0}[type];if(cost===undefined)return;if(g.gold<cost)return alert('金錢不足');if(type==='break'){if(!active('alliances','織田',target))return alert('目前沒有同盟');delete g.diplomacy.alliances[key];setRelation('織田',target,rel-30);g.diplomacy.credit=Math.max(0,g.diplomacy.credit-25);log('織田家解除與'+target+'家的同盟，外交信用下降')}else if(type==='improve'){g.gold-=cost;setRelation('織田',target,rel+15);log('派遣使者至'+target+'家，關係改善至'+relation('織田',target))}else if(type==='alliance'){if(active('alliances','織田',target))return alert('雙方已結盟');g.gold-=cost;let chance=Math.max(.05,Math.min(.9,.25+(rel+50)/200+g.diplomacy.credit/500));if(Math.random()<chance){g.diplomacy.alliances[key]=g.turn+6;delete g.diplomacy.truces[key];setRelation('織田',target,rel+10);log('織田與'+target+'締結六回合同盟！')}else log(target+'家拒絕結盟提議')}else if(type==='truce'){if(peaceful('織田',target))return alert('已有同盟或停戰');g.gold-=cost;let chance=Math.max(.1,Math.min(.9,.5+rel/250));if(Math.random()<chance){g.diplomacy.truces[key]=g.turn+3;log('織田與'+target+'達成三回合停戰')}else log(target+'家拒絕停戰提議')}save();render()}
function ai(){for(const owner of ['齋藤','今川']){if(!g.cities.some(c=>c.owner===owner))continue;let supply=Number(g.aiSupply[owner])||0;let cities=g.cities.filter(c=>c.owner===owner);let threatened=cities.some(c=>nearby(c.id).some(i=>g.cities[i].owner!==owner&&g.cities[i].troops>c.troops*1.2));for(const c of cities){supply+=Math.max(80,Math.round(c.farm*140));if(c.troops<(threatened?3500:2600)&&supply>=240){c.units.foot+=120;c.troops=unitTotal(c.units);supply-=240}if(!threatened&&supply>=400&&c.farm<5&&Math.random()<.25){c.farm++;supply-=400}if(threatened&&supply>=350&&c.def<90){c.def=Math.min(100,c.def+8);supply-=350}}let candidates=cities.flatMap(c=>nearby(c.id).map(i=>({from:c,to:g.cities[i]}))).filter(x=>x.to.owner!==owner&&!peaceful(owner,x.to.owner)).sort((a,b)=>(a.to.troops/a.from.troops)-(b.to.troops/b.from.troops));if(candidates.length){let {from,to}=candidates[0];let temperament=owner==='齋藤'?2.25:1.65;if(from.troops>Math.max(800,to.troops*temperament)&&supply>=500&&Math.random()<(owner==='今川'?.5:.28)){supply-=500;battle(from.id,to.id,Math.floor(from.troops*.6));setRelation(owner,to.owner,relation(owner,to.owner)-12)}}if(threatened){let other=FACTIONS.filter(f=>f!==owner&&g.cities.some(c=>c.owner===f)).sort((a,b)=>relation(owner,b)-relation(owner,a))[0];if(other&&!peaceful(owner,other)&&relation(owner,other)>-25&&Math.random()<.16){g.diplomacy.truces[pair(owner,other)]=g.turn+3;log(owner+'家與'+other+'家達成暫時停戰')}}g.aiSupply[owner]=supply}}
function check(){if(!owned().length){g.over=true;log('織田家滅亡，遊戲結束')}else if(g.cities.every(c=>c.owner==='織田')){g.over=true;log('天下統一！織田家獲得勝利！')}}
function nextTurn(){if(g.over)return;for(const c of owned()){c.morale=Math.min(100,c.morale+4);let bonus=1+Math.max(0,officer(c.officer).p-60)/200+(c.officer?Math.max(0,loyaltyOf(c.officer)-60)/500:0);g.gold+=Math.round(c.trade*180*bonus);g.rice+=Math.round(c.farm*550*bonus)-Math.ceil(c.troops/10)}g.rice=Math.max(0,g.rice);ai();personnelTurn();g.turn++;for(const type of ['alliances','truces'])for(const [k,v] of Object.entries(g.diplomacy[type]))if(v<=g.turn){delete g.diplomacy[type][k];log(k.replace('|','與')+'的'+(type==='alliances'?'同盟':'停戰')+'期限已到')}check();log('進入第'+g.turn+'回合');save();render()}

 ];
 const p=phases[phase];
 const stats=phase===3?`<div class="ui-battle-stats"><div class="ui-battle-stat">我軍投入<b>${r.attack}</b></div><div class="ui-battle-stat">我軍損失約<b>${r.attackLost}</b></div><div class="ui-battle-stat">敵軍損失約<b>${r.defendLost}</b></div><div class="ui-battle-stat">城防 / 圍城<b>${r.walls} / ${r.siege}%</b></div></div>`:'';
 el.innerHTML=`<div class="ui-battle-step">戰報 ${phase+1} / 4</div><div class="ui-battle-phase"><div class="phase-icon">${p.icon}</div><h3>${p.title}</h3><p>${p.text}</p></div>${stats}<div class="ui-battle-actions"><button type="button" onclick="uiDismissBattle()">關閉</button>${phase<3?'<button type="button" onclick="uiBattleNext()">下一幕 →</button>':'<button type="button" onclick="uiDismissBattle()">返回軍議</button>'}</div>`;
}
function uiBattleReport(){
 if(!pendingBattleResult)return;
 pendingBattleResult=false;
 if(!g.war?.last)return;
 battlePhaseIndex=0;uiDrawBattlePhase();document.getElementById('battleOverlay').hidden=false;
}
function cityDashboard(c){
 const o=officer(c.officer),units=c.units||{foot:c.troops,horse:0,gun:0};
 const metric=(name,value)=>`<div class="ui-city-metric"><span>${name}</span><b>${value}</b></div>`;
 return `<div class="ui-city-dashboard"><div class="ui-city-head"><div class="ui-portrait"><span class="crest">🏯</span><span class="portrait-name">${c.name}</span></div><div><h2>${c.name}城</h2><p>${c.owner}家 · 城主 ${o.n}<br>特性 ${o.t}</p></div></div><div class="ui-city-grid">${metric('總兵力',c.troops.toLocaleString())}${metric('士氣',c.morale)}${metric('城防',Math.round(c.def))}${metric('農業',c.farm)}${metric('商業',c.trade)}${metric('圍城',c.siege+'%')}</div><div class="ui-city-units">🛡 足輕 ${units.foot}　🐎 騎馬 ${units.horse}　💥 鐵砲 ${units.gun}</div><div class="ui-quick-nav"><button type="button" onclick="uiSwitch('military')">⚔ 軍議與出征 →</button><button type="button" onclick="uiSwitch('officers')">👥 家臣團 →</button></div></div>`;
}
function uiEnhance(){
 const game=document.getElementById('game');
 const hud=game.querySelector('.hud');
 const mapLaunch=game.querySelector('.map-launch');
 const panels=[...game.querySelectorAll(':scope > section.panel')];
 if(panels.length<4)return;
 const castle=panels[0],diplomacy=panels[1],personnel=panels[2],chronicle=panels[3];
 const footer=[...game.children].filter(el=>el!==hud&&el!==mapLaunch&&!panels.includes(el));
 const screens={};
 for(const name of ['map','domestic','military','diplomacy','officers']){
  const section=document.createElement('div');section.className='ui-screen';section.dataset.screen=name;game.appendChild(section);screens[name]=section;
 }
 const c=g.cities[g.selected],o=officer(c.officer),season=['春','夏','秋','冬'][(g.turn-1)%4],year=1560+Math.floor((g.turn-1)/4);
 screens.map.innerHTML=`<div class="sengoku-hero"><div class="sengoku-hero-top"><strong>天下布武 · 戰略圖</strong><small>${year}年 ${season} · 第${g.turn}回合</small></div><div class="sengoku-hero-map">${mapMarkup(year,season).replaceAll('onclick="selectCity(','onclick="uiSelectCity(')}</div><div class="sengoku-hero-foot"><span>點選城池即可進入城池管理</span><button onclick="openMap()">⛶ 全螢幕</button></div></div><div class="ui-city-summary"><div class="ui-portrait"><span class="crest">⚔</span><span class="portrait-name">${o.n}</span></div><div><strong>🏯 ${c.name}城</strong><p>${c.owner}家 · 駐軍 ${c.troops.toLocaleString()}<br>城防 ${Math.round(c.def)} · 士氣 ${c.morale} · 城主 ${o.n}</p><button onclick="uiSwitch('domestic')">管理此城 →</button></div></div><div class="ui-screen-title">📜 戰國紀事</div>`;
 screens.map.appendChild(chronicle);
 const citySummary=document.createElement('div');citySummary.innerHTML=cityDashboard(c);screens.domestic.appendChild(citySummary);
 // Reuse the existing castle section: split into functional cards while keeping original controls and IDs.
 const domesticPanel=document.createElement('section');domesticPanel.className='panel';
 const militaryPanel=document.createElement('section');militaryPanel.className='panel';
 const children=[...castle.children];
 let warMode=false;
 for(const node of children){
  if(node.tagName==='H2'&&node.textContent.includes('戰國軍略'))warMode=true;
  (warMode?militaryPanel:domesticPanel).appendChild(node);
 }
 // warPanel is injected as HTML after castle controls; its header is a direct H2.
 screens.domestic.appendChild(domesticPanel);
 screens.military.appendChild(militaryPanel);
 screens.diplomacy.appendChild(diplomacy);
 screens.officers.appendChild(personnel);
 const footerBox=document.createElement('section');footerBox.className='panel';
 footerBox.innerHTML='<h2>⚙ 回合管理</h2>';
 footer.forEach(el=>footerBox.appendChild(el));
 screens.map.appendChild(footerBox);
 castle.remove();mapLaunch?.remove();
 const tabs=[['map','🗾','地圖'],['domestic','🏯','內政'],['military','⚔','軍事'],['diplomacy','🤝','外交'],['officers','👥','武將']];
 document.getElementById('uiTabs').innerHTML=tabs.map(([id,icon,label])=>`<button type="button" data-screen="${id}" onclick="uiSwitch('${id}')"><span class="tab-icon">${icon}</span>${label}</button>`).join('');
 // military screen should still provide an enemy selection when not owning a castle.
 if(!militaryPanel.children.length)militaryPanel.innerHTML='<h2>⚔ 軍議</h2><p class="hint">請先從地圖選擇本家城池，才能下達出征命令。</p><button onclick="uiSwitch(\'map\')">返回戰略地圖</button>';
 uiSwitch(activeScreen,true);
 uiBattleReport();
}

function render(){
 // Remember the viewport before replacing #game; Safari otherwise jumps to the top.
 const previousY=window.scrollY||window.pageYOffset||0;
 const previousScreen=activeScreen;
 let c=g.cities[g.selected],o=officer(c.officer),enemies=nearby(c.id).map(i=>g.cities[i]).filter(x=>x.owner!=='織田'),choices=OFFICERS.filter(x=>factionOf(x.id)==='織田'),season=['春','夏','秋','冬'][(g.turn-1)%4],year=1560+Math.floor((g.turn-1)/4);document.getElementById('game').innerHTML=`<div class="hud" id="hud"><div class="stats"><div class="stat ${g.gold<400?'low':''}">💰 軍資金<b>${g.gold.toLocaleString()}</b></div><div class="stat ${g.rice<500?'low':''}">🌾 兵糧<b>${g.rice.toLocaleString()}</b></div><div class="stat">⏳ 回合<b>${g.turn}</b></div></div></div><div class="map-launch"><div><strong>🗾 戰略地圖</strong><div class="hint">十五城配置 · 點擊開啟全螢幕</div></div><button type="button" id="openMapButton" onclick="openMap()">查看地圖 ↗</button></div><section class="panel"><h2>🏯 ${c.name}城</h2><p>勢力：${c.owner}家　兵力：${c.troops}</p><p>城防：${Math.round(c.def)}　農業：${c.farm}　商業：${c.trade}</p><div class="officer"><b>⚔ ${o.n}</b><p>統率 ${o.c}｜武勇 ${o.w}</p><p>智略 ${o.i}｜政治 ${o.p}</p><small>固有特性：${o.t}</small></div>${c.owner==='織田'&&!g.over?`<p class="hint">本回合：不限次數行動 · 只受資源與兵力限制</p><h2>內政指令</h2><div class="actions"><button onclick="doDomesticAction('farm')">開墾 300金</button><button onclick="doDomesticAction('trade')">商業 350金</button><button onclick="doDomesticAction('def')">築城 250金</button><button onclick="doDomesticAction('recruit')">徵兵 400金</button></div><h2 style="margin-top:18px">武將任命</h2><p class="hint">可直接調任其他城池的現任城主，原城主會回到待命家臣。交換兩城城主也無需先解除任命。</p><select id="officers" onchange="selectedTarget('officers')">${choices.map(x=>{let current=g.cities.find(z=>z.officer===x.id);return `<option value="${x.id}"${optionSelected('officers',x.id)||(!g.uiSelections?.officers&&x.id===c.officer)?' selected':''}>${x.n}｜${current?current.name+'城主':'待命'}｜統率${x.c} 政治${x.p}</option>`}).join('')}</select><button class="full" onclick="appoint()">任命／調任城主</button><button class="full" onclick="dismissCastellan()" ${c.officer?'':'disabled'}>解除本城城主任命</button><p class="personnel-subtitle">🔄 交換兩城城主</p><select id="swapCity" onchange="selectedTarget('swapCity')">${owned().filter(x=>x.id!==c.id&&x.officer).map(x=>`<option value="${x.id}"${optionSelected('swapCity',x.id)}>${x.name}｜${officer(x.officer).n}</option>`).join('')}</select><button class="full" onclick="swapCastellans()" ${owned().some(x=>x.id!==c.id&&x.officer)&&c.officer?'':'disabled'}>確認交換城主</button>${warPanel(c,enemies)}`:`<p class="hint">${g.over?'遊戲已結束':'此城目前不屬於織田家。'}</p>`}</section><section class="panel"><h2>🤝 外交評議</h2><p class="hint">外交信用：${g.diplomacy.credit}｜可不限次數交涉</p>${FACTIONS.filter(f=>f!=='織田'&&g.cities.some(c=>c.owner===f)).map(f=>`<p>${f}家：關係 ${relation('織田',f)}｜${active('alliances','織田',f)?'同盟至第'+g.diplomacy.alliances[pair('織田',f)]+'回合':active('truces','織田',f)?'停戰至第'+g.diplomacy.truces[pair('織田',f)]+'回合':'無條約'}</p>`).join('')}${!g.over?`<select id="diplomacyTarget" onchange="selectedTarget('diplomacyTarget')">${FACTIONS.filter(f=>f!=='織田'&&g.cities.some(c=>c.owner===f)).map(f=>`<option value="${f}"${optionSelected('diplomacyTarget',f)}>${f}家</option>`).join('')}</select><div class="actions"><button onclick="diplomacyAction('improve')">改善關係 200金</button><button onclick="diplomacyAction('alliance')">締結同盟 500金</button><button onclick="diplomacyAction('truce')">提出停戰 300金</button><button onclick="diplomacyAction('break')">解除同盟</button></div>`:''}</section>${personnelPanel()}<section class="panel"><h2>📜 戰國紀事</h2><div class="log">${g.logs.map(x=>`<div>• ${x}</div>`).join('')}</div></section>${g.over?`<section class="panel"><h2>${owned().length?'🎉 統一成功':'💀 遊戲結束'}</h2></section>`:''}<button class="full" onclick="nextTurn()" ${g.over?'disabled':''}>結束回合 →</button><button class="full" onclick="reset()">重新開始</button><p class="hint">V0.6.2 · 戰國軍略 · 15城／36名史實人物 · 1560架空配置 · 相容舊存檔</p>`;refreshMapDialog();uiEnhance();warPreview();
 // Restore scroll after the selected screen has been reconstructed.
 // Clamp to the new document height (e.g. a panel became shorter).
 const restore=()=>{
  if(activeScreen!==previousScreen)return;
  const maxY=Math.max(0,document.documentElement.scrollHeight-window.innerHeight);
  window.scrollTo({top:Math.min(previousY,maxY),behavior:'instant'});
 };
 restore();requestAnimationFrame(restore);
}

load();
</script></body></html>
