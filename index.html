function portraitSvg(o){
 const id=o.id,skin=['#e3bc91','#d5a77b','#bd8e6c','#edc49b'][id%4],armor=['#405c63','#594d60','#725a40','#465a48','#634b47'][id%5],trim=['#c9a56c','#c7a8a1','#aebcb6'][id%3],hair=['#24292b','#38302d','#242d37'][id%3];
 return `<svg class="portrait-art" viewBox="0 0 100 120" role="img" aria-label="${o.n}風格化示意肖像" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="120" fill="${trim}"/><path d="M0 120Q7 83 35 82H65Q93 83 100 120" fill="${armor}" stroke="#c9a56c" stroke-width="2"/><path d="M30 43Q27 17 50 17Q74 17 70 43L68 66Q60 83 50 83Q39 83 32 66Z" fill="${skin}"/><path d="M27 48Q18 16 50 13Q83 16 73 48L65 35Q50 28 34 38Z" fill="${hair}"/>${id%3===0?`<path d="M17 35Q25 5 50 7Q77 5 83 35L70 31Q50 21 30 31Z" fill="${armor}" stroke="${trim}" stroke-width="3"/>`:''}<path d="M36 44l10 -1M55 43l10 1" stroke="${hair}" stroke-width="2"/><path d="M49 49l-2 13h6" fill="none" stroke="#996f57"/><path d="M43 69Q50 ${69+id%3} 57 69" fill="none" stroke="#775448" stroke-width="1.5"/>${id%4===0?'<path d="M41 73Q50 86 59 73" fill="none" stroke="#3b2b28" stroke-width="3"/>':''}<path d="M35 87L50 108 65 87" fill="#d6c5ad"/><path d="M10 107L25 92M90 107L75 92" stroke="${trim}" stroke-width="3"/></svg>`;
}
function showOfficerBio(id){
 const o=OFFICERS.find(x=>x.id===id);if(!o)return;
 const faction=g.personnel[id]?.faction||o.f;
 const d=document.getElementById('officerBioDialog');
 d.innerHTML=`<div class="bio-card"><button type="button" class="bio-close" onclick="closeOfficerBio()" aria-label="關閉人物列傳">✕</button><div class="bio-hero">${portraitSvg(o)}<div><small>戰國人物列傳 · 第 ${String(id).padStart(2,'0')} 號</small><h2>${o.n}</h2><p>${faction}家</p><p>固有特性：${o.t}</p></div></div><div class="bio-abilities"><span>統率 ${o.c}</span><span>武勇 ${o.w}</span><span>智略 ${o.i}</span><span>政務 ${o.p}</span></div><p><b>⚔ 專屬戰法</b><br>${WAR_ARTS[id]?.name||'尚未習得'}</p><p><b>📜 人物簡介</b><br>${OFFICER_BIOS[id]||'人物史料待補充。'}</p><p class="hint">肖像為原創風格化示意，非史實容貌復原；家紋待史料核對後才會加入。現有登場年代與勢力配置尚待歷史校正。</p><button class="full" onclick="closeOfficerBio()">返回武將管理</button></div>`;
 d.hidden=false;document.body.classList.add('bio-open');
}
function closeOfficerBio(){document.getElementById('officerBioDialog').hidden=true;document.body.classList.remove('bio-open')}

function currentScenarioYear(){return (g.startYear||1546)+Math.floor((g.turn-1)/4)}
function isHistoricalScenario(){return g.scenarioVersion==='tenbun1546'}
function officerAvailable(id){return !isHistoricalScenario()||currentScenarioYear()>=(HISTORICAL_ARRIVALS[id]||1546)}
function scenarioArrival(){
 if(!isHistoricalScenario())return;
 const year=currentScenarioYear();
 for(const o of OFFICERS){
  const p=g.personnel[o.id];
  if(!p||p.faction!=='未登場'||year<(HISTORICAL_ARRIVALS[o.id]||1546))continue;
  p.faction='浪人';p.loyalty=0;
  log(`📜 ${year}年：${o.n}進入可登用武將名單`);
 }
 if(year===1549)log('📜 1549年：松平氏與今川氏的關係逐步改變（三河情勢事件提示）。');
 if(year===1560)log('📜 1560年：桶狹間之戰的歷史年份已至；本作尚未強制改寫玩家戰局。');
}

function selectCity(id){
 const viewport=document.querySelector('#mapDialog .map-dialog-body');
 const camera=viewport?{x:viewport.scrollLeft,y:viewport.scrollTop}:null;
 // V0.9.0: Selecting a castle must never reconstruct the full-screen map.
 // Replacing the SVG used to reset Safari's scroll container and recenter the camera.
 g.selected=id;v093HasSelection=true;document.body.classList.add('v093-selected');
 save();
 if(mapIsOpen){
  const selection=document.getElementById('mapSelection');
  const c=g.cities[id];
  if(selection&&c)selection.textContent=`目前選取：${c.name}城｜${c.owner}家｜${c.troops}兵`;
  document.querySelectorAll('#mapDialog .map-node').forEach(node=>{
   node.classList.toggle('selected',Number(node.dataset.cityId)===Number(id));
  });
  v093UpdateMapSelection(document.querySelector("#mapDialog .map-dialog-body"));
  v089ShowSheet(id,true);
  if(camera&&viewport){
   viewport.scrollLeft=camera.x;viewport.scrollTop=camera.y;
   requestAnimationFrame(()=>{if(mapIsOpen){viewport.scrollLeft=camera.x;viewport.scrollTop=camera.y;}});
  }
  // The road overlay depends on the selected city, but only redraw it if
  // the player changes the map mode explicitly; never reset the viewport here.
  return;
 }
 render();
}

function warArt(o,tactic,turn,preview=false){
 const art=WAR_ARTS[o.id];if(!art)return null;
 const born={1:1534,19:1537,20:1538,25:1544,33:1546};
 const year=(g.startYear||1546)+Math.floor((turn-1)/4);
 if(born[o.id]&&year-born[o.id]<15)return null;
 const chance=Math.min(.75,.28+(o.i-70)*.0015+(art.tactic===tactic?.10:0));
 return preview?{...art,chance}:Math.random()<chance?{...art,chance}:null;

function armyPower(u,attacking=true,enemyUnits=null){
 let total=0;
 for(const k of ['foot','horse','gun']){
  const base={foot:1,horse:1.65,gun:1.9}[k]*(attacking?1:{foot:1.05,horse:1.05,gun:.8}[k]);
  const enemy=enemyUnits?unitTotal(enemyUnits):0;
  const target=enemy?Math.max(0,enemyUnits[COUNTER[k]]||0)/enemy:0;
  // Counter bonus: up to +30% when the opponent relies entirely on the vulnerable unit.
  total+=Math.max(0,u[k]||0)*base*(1+.30*target);
 }
 return total;
}
function allocatedArmy(city,n){
 n=Math.min(Math.max(0,Math.floor(n)),city.troops);
 const send={},ratio=city.troops?n/city.troops:0;
 for(const k of ['foot','horse','gun'])send[k]=Math.floor(city.units[k]*ratio);
 let remaining=n-unitTotal(send);
 for(const k of ['foot','horse','gun']){
  const extra=Math.min(city.units[k]-send[k],remaining);
  send[k]+=extra;remaining-=extra;
 }
 return send;
}
function battleEstimate(a,b,n,config={}){
 const x=g.cities[a],y=g.cities[b],tactic=TACTICS[config.tactic]||TACTICS.balanced;
 const commander=officerForBattle(x,config.commander),defender=officer(y.officer);
 const send=allocatedArmy(x,n),defenseUnits=y.units;
 const am=.70+x.morale/250,dm=.70+y.morale/250;
 const surprise=config.tactic==='surprise'?Math.max(.75,Math.min(1.45,.65+commander.i/130+(commander.i-defender.i)/240)):1;
 const atkTrait=traitInfo(commander),defTrait=traitInfo(defender);
 const traitAttack=(atkTrait.attack||1)*(config.tactic==='surprise'?(atkTrait.surprise||1):1)*(config.tactic==='siege'?(atkTrait.siege||1):1);
 const traitDefense=defTrait.defense||1;
 const atk=armyPower(send,true,defenseUnits)*(.74+commander.c/240+commander.w/650)*tactic.attack*surprise*am*traitAttack*(config.commander&&loyaltyOf(config.commander)>=85?1.05:1)*(1+(atkTrait.foot?Math.min(1,send.foot/Math.max(1,unitTotal(send)))*(atkTrait.foot-1):0));
 const fort=Math.max(.72,1+y.def/210-y.siege/220);
 const def=armyPower(defenseUnits,false,send)*(.75+defender.c/240)*fort*tactic.defense*dm*traitDefense*(y.officer&&loyaltyOf(y.officer)>=85?1.05:1);
 // Exact uniform random factors in [0.90,1.10] are sampled for actual combat.
 // Preview integrates a 41x41 grid over the same factors (an estimate, not a guarantee).
 let wins=0;
 for(let i=0;i<41;i++)for(let j=0;j<41;j++)if(atk*(.90+i*.005)>def*(.90+j*.005))wins++;
 const chance=Math.round(wins/1681*100);
 const winLoss=Math.min(.93,Math.max(.19,.30*tactic.loss*(def/Math.max(atk,1))**.20));
 const loseLoss=Math.min(.93,Math.max(.19,.66*tactic.loss*(def/Math.max(atk,1))**.20));
 const loss=Math.round(unitTotal(send)*(chance/100*winLoss+(1-chance/100)*loseLoss));
 return {atk,def,chance,loss,send,commander,defender,traitAttack:atkTrait.desc,traitDefense:defTrait.desc};
}

function battle(a,b,n,config={}){
 const x=g.cities[a],y=g.cities[b];
 if(!x||!y||x.owner===y.owner||!nearby(a).includes(b)||peaceful(x.owner,y.owner))return false;
 const tactic=TACTICS[config.tactic]||TACTICS.balanced;
 const commander=officerForBattle(x,config.commander);
 const defender=officer(y.officer);
 n=Math.min(Math.max(0,Math.floor(n)),x.troops);
 if(n<100)return false;
 const send=allocatedArmy(x,n);
 n=unitTotal(send);
 if(n<100)return false;
 const defenseUnits={...y.units},defenderBefore=unitTotal(defenseUnits);
 const estimate=battleEstimate(a,b,n,config);
 const attackingArt=warArt(commander,config.tactic||'balanced',g.turn);
 const defendingArt=warArt(defender,'balanced',g.turn);
 const attackArtBase=estimate.atk;
 const defenseArtBase=estimate.def;
 const atk=estimate.atk*(attackingArt?.power||1)*(.90+Math.random()*.20);
 const def=estimate.def*(defendingArt?.power||1)*(.90+Math.random()*.20);
 const success=atk>def;
 const attackerLoss=Math.min(.93,Math.max(.19,(success?.30:.66)*tactic.loss*(def/Math.max(atk,1))**.20));
 const defenderLoss=Math.min(.96,Math.max(.12,(success?.83:.35)*(atk/Math.max(def,1))**.16));
 for(const k of ['foot','horse','gun']){
  x.units[k]-=send[k];
  const survivors=Math.round(send[k]*(1-attackerLoss));
  if(success)y.units[k]=survivors;
  else x.units[k]+=survivors;
  if(!success)y.units[k]=Math.max(0,Math.round(y.units[k]*(1-defenderLoss)));
 }
 const walls=Math.round((success?18:config.tactic==='siege'?19:8)*tactic.wall);
 y.def=Math.max(10,y.def-walls);
 y.siege=success?0:Math.min(100,y.siege+walls);
 y.morale=success?Math.max(45,Math.round(x.morale-8)):Math.max(20,y.morale-12);
 x.morale=Math.max(25,x.morale-(success?5:13));
 if(success){
  const old=y.officer,former=y.owner;
  y.owner=x.owner;y.officer=0;
  if(old&&g.personnel[old]){
   g.personnel[old].faction='浪人';g.personnel[old].loyalty=0;
   g.reserve=g.reserve.filter(id=>id!==old);
  }
  log('⚔ '+commander.n+'以'+tactic.name+'攻陷'+y.name+'城（原'+former+'家）；新駐軍'+unitTotal(y.units)+'人');
 }else log('⚔ '+commander.n+'以'+tactic.name+'攻打'+y.name+'失利；城防降至'+Math.round(y.def)+'，攻城進度'+y.siege);
 x.troops=unitTotal(x.units);y.troops=unitTotal(y.units);
 if(config.commander&&g.personnel[config.commander])g.personnel[config.commander].xp+=(success?10:4);
 g.war.last={turn:g.turn,from:x.name,to:y.name,commander:commander.n,tactic:tactic.name,success,attack:n,attackLost:Math.round(n*attackerLoss),defendLost:Math.round(defenderBefore*defenderLoss),walls:y.def,siege:y.siege,winChance:estimate.chance,trait:estimate.traitAttack,art:attackingArt?.name||'',defenseArt:defendingArt?.name||'',
 attackArtMultiplier:attackingArt?.power||1,defenseArtMultiplier:defendingArt?.power||1,
 attackArtBonus:Math.round(attackArtBase*((attackingArt?.power||1)-1)),
 defenseArtBonus:Math.round(defenseArtBase*((defendingArt?.power||1)-1)),
 attackArtChance:Math.round((warArt(commander,config.tactic||'balanced',g.turn,true)?.chance||0)*100),
 defenseArtChance:Math.round((warArt(defender,'balanced',g.turn,true)?.chance||0)*100),
 defenderName:defender.n,attackBase:Math.round(attackArtBase),defenseBase:Math.round(defenseArtBase)};
 return true;
}

 const footerBox=document.createElement('section');footerBox.className='panel';

 // military screen should still provide an enemy selection when not owning a castle.
 if(!militaryPanel.children.length)militaryPanel.innerHTML='<h2>⚔ 軍議</h2><p class="hint">請先從地圖選擇本家城池，才能下達出征命令。</p><button onclick="uiSwitch(\'map\')">返回戰略地圖</button>';
 uiSwitch(activeScreen,true);

 const previousY=window.scrollY||window.pageYOffset||0;

swapCity" onchange="selectedTarget('swapCity')">${owned().filter(x=>x.id!==c.id&&x.officer).map(x=>`<option value="${x.id}"${optionSelected('swapCity',x.id)}>${x.name}｜${officer(x.officer).n}</option>`).join('')}</select><button class="full" onclick="swapCastellans()" ${owned().some(x=>x.id!==c.id&&x.officer)&&c.officer?'':'disabled'}>確認交換城主</button>${warPanel(c,enemies)}`:`<p class="hint">${g.over?'遊戲已結束':'此城目前不屬於織田家。'}</p>`}</section><section class="panel"><h2>🤝 外交評議</h2><p class="hint">外交信用：${g.diplomacy.credit}｜可不限次數交涉</p>${FACTIONS.filter(f=>f!=='織田'&&g.cities.some(c=>c.owner===f)).map(f=>`<p>${f}家：關係 ${relation('織田',f)}｜${active('alliances','織田',f)?'同盟至第'+g.diplomacy.alliances[pair('織田',f)]+'回合':active('truces','織田',f)?'停戰至第'+g.diplomacy.truces[pair('織田',f)]+'回合':'無條約'}</p>`).join('')}${!g.over?`<select id="diplomacyTarget" onchange="selectedTarget('diplomacyTarget')">${FACTIONS.filter(f=>f!=='織田'&&g.cities.some(c=>c.owner===f)).map(f=>`<option value="${f}"${optionSelected('diplomacyTarget',f)}>${f}家</option>`).join('')}</select><div class="actions"><button onclick="diplomacyAction('improve')">改善關係 200金</button><button onclick="diplomacyAction('alliance')">締結同盟 500金</button><button onclick="diplomacyAction('truce')">提出停戰 300金</button><button onclick="diplomacyAction('break')">解除同盟</button></div>`:''}</section>${personnelPanel()}<section class="panel"><h2>📜 戰國紀事</h2><div class="log">${g.logs.map(x=>`<div>• ${x}</div>`).join('')}</div></section>${g.over?`<section class="panel"><h2>${owned().length?'🎉 統一成功':'💀 遊戲結束'}</h2></section>`:''}<button class="full" onclick="nextTurn()" ${g.over?'disabled':''}>結束回合 →</button><button class="full" onclick="reset()">重新開始</button><p class="hint">V0.8.0 · 浮世繪地圖更新 · 44城／8勢力 · 依使用者資料表配置 · 示意座標 · 相容舊存檔</p>`;refreshMapDialog();uiEnhance();warPreview();const turnFab=document.getElementById('turnFab');if(turnFab){turnFab.disabled=!!g.over;turnFab.textContent=g.over?'⏳ 遊戲結束':'⏳ 結束回合';}
 // Restore scroll after the selected screen has been reconstructed.
 // Clamp to the new document height (e.g. a panel became shorter).
 const restore=()=>{
  if(activeScreen!==previousScreen)return;
  const maxY=Math.max(0,document.documentElement.scrollHeight-window.innerHeight);
  window.scrollTo({top:Math.min(previousY,maxY),behavior:'instant'});
 };
 document.querySelectorAll('.sengoku-hero-map,.map-dialog-body').forEach((el,i)=>{if(mapScroll[i]){el.scrollLeft=mapScroll[i][0];el.scrollTop=mapScroll[i][1];}});
 restore();requestAnimationFrame(()=>{restore();fitAllMapViewports({preserveCenter:false});document.querySelectorAll('.sengoku-hero-map,.map-dialog-body').forEach((el,i)=>{if(mapScroll[i]){el.scrollLeft=mapScroll[i][0];el.scrollTop=mapScroll[i][1];}});});
}


// V0.9.7: measure the main-map toolbar rather than guessing its height.
function v091MeasureMainMap(){
 const bar=document.querySelector('.ui-screen[data-screen="map"] .v082-bottom');
 const screen=document.querySelector('.ui-screen[data-screen="map"]');
 if(!bar||!screen)return;
 const height=Math.ceil(bar.getBoundingClientRect().height);
 if(height>0&&screen.style.getPropertyValue('--v091-bottom-height')!==height+'px'){
  screen.style.setProperty('--v091-bottom-height',height+'px');
  requestAnimationFrame(()=>{
   const viewport=screen.querySelector('.sengoku-hero-map');
   if(!viewport||!viewport.clientHeight)return;
   fitMapViewport(viewport,{preserveCenter:true});
   viewport.scrollTop=Math.min(viewport.scrollTop,Math.max(0,viewport.scrollHeight-viewport.clientHeight));
  });
 }
}
if(typeof ResizeObserver!=='undefined'){
 const v091ToolbarObserver=new ResizeObserver(()=>v091MeasureMainMap());
 const v091ObserveToolbar=()=>{const bar=document.querySelector('.ui-screen[data-screen="map"] .v082-bottom');if(bar)v091ToolbarObserver.observe(bar);v091MeasureMainMap();};
 const v091DOMObserver=new MutationObserver(()=>v091ObserveToolbar());
 v091DOMObserver.observe(document.getElementById('game'),{childList:true,subtree:false});
 window.addEventListener('resize',v091MeasureMainMap,{passive:true});
}

// Mouse drag pans; touch uses native two-axis scrolling. A drag never selects a city.
let mapDrag=null,suppressMapClick=false;
document.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button!==0)return;const viewport=e.target.closest('.sengoku-hero-map,.map-dialog-body');if(!viewport)return;mapDrag={viewport,x:e.clientX,y:e.clientY,left:viewport.scrollLeft,top:viewport.scrollTop,moved:false};});
document.addEventListener('pointermove',e=>{if(!mapDrag)return;const d=mapDrag,dx=e.clientX-d.x,dy=e.clientY-d.y;if(Math.hypot(dx,dy)>6)d.moved=true;if(d.moved){d.viewport.scrollLeft=d.left-dx;d.viewport.scrollTop=d.top-dy;e.preventDefault();}});
document.addEventListener('pointerup',()=>{if(mapDrag?.moved){suppressMapClick=true;setTimeout(()=>suppressMapClick=false,0);}mapDrag=null;});
document.addEventListener('pointercancel',()=>mapDrag=null);
document.addEventListener('click',e=>{if(suppressMapClick&&e.target.closest('.map-node')){e.preventDefault();e.stopImmediatePropagation();}},true);

window.addEventListener('resize',()=>requestAnimationFrame(()=>fitAllMapViewports()));
window.addEventListener('orientationchange',()=>requestAnimationFrame(()=>fitAllMapViewports()));
load();
requestAnimationFrame(()=>fitAllMapViewports({preserveCenter:false}));
