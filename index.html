<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>戰國群雄錄 V0.3.5</title><style>*{box-sizing:border-box}body{margin:0;background:#171e28;color:#f2e5c5;font-family:system-ui}header{text-align:center;background:#293447;padding:16px;border-bottom:3px solid #c6a268}h1{font-size:25px;color:#f6d28a;margin:0}small,.hint{color:#bcb9ae}main{max-width:560px;margin:auto;padding:12px}.panel{background:#283445;border:2px solid #647082;padding:13px;margin:12px 0;border-radius:5px}h2{font-size:18px;color:#f6d28a;margin:0 0 12px}.stats,.map,.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stats{grid-template-columns:repeat(3,1fr);position:sticky;top:0;z-index:100;background:#171e28;padding:8px 0 9px;margin:-8px 0 8px;box-shadow:0 6px 12px rgba(0,0,0,.4);border-bottom:1px solid #c6a268}.stats .stat{padding:8px 3px}.stats .stat b{font-variant-numeric:tabular-nums;font-size:clamp(14px,4vw,18px)}.stats .stat.low b{color:#ff8d81}.stat{text-align:center;background:#192533;padding:10px 3px;font-size:12px}.stat b{display:block;color:#f6d28a;font-size:18px}button,select{font:inherit}button{background:#725936;border:2px solid #c9a46b;color:#fff0d0;padding:11px 5px;border-radius:4px;cursor:pointer}button:disabled{opacity:.35}.castle{background:#26394b;min-height:75px}.castle.enemy{background:#563b48}.castle.active{outline:3px solid #f6d28a}.castle strong{display:block}.castle span{font-size:12px}.full{width:100%;margin-top:10px}.officer{background:#192533;padding:11px;margin:9px 0;border-left:4px solid #c9a46b}.officer b{color:#f6d28a}select{width:100%;padding:10px;background:#192533;color:white;border:1px solid #8893a0;margin:8px 0}.log{font-size:13px;line-height:1.8;max-height:220px;overflow:auto}.hint{font-size:12px}

</style></head><body><header><h1>⚔ 戰國群雄錄 ⚔</h1><small>V0.3.5 戰國外交風雲</small></header><main id="game"></main><button class="map-fab" type="button" onclick="openMap()" aria-label="隨時開啟戰略地圖">🗾 地圖</button>
<div id="mapDialog" class="map-dialog" role="dialog" aria-modal="true" aria-label="戰略地圖" aria-hidden="true">

</div><script>
'use strict';
const OFFICERS=[
{id:1,n:'織田信長',f:'織田',c:92,w:85,i:91,p:96,t:'天下布武'},
{id:2,n:'柴田勝家',f:'織田',c:88,w:94,i:65,p:58,t:'鬼柴田'},
{id:3,n:'丹羽長秀',f:'織田',c:78,w:68,i:82,p:89,t:'米五郎左'},
{id:4,n:'池田恆興',f:'織田',c:75,w:76,i:71,p:69,t:'忠義'},
{id:5,n:'森可成',f:'織田',c:82,w:88,i:67,p:61,t:'攻勢'},
{id:6,n:'佐久間信盛',f:'織田',c:76,w:69,i:70,p:73,t:'守備'},
{id:7,n:'齋藤義龍',f:'齋藤',c:84,w:78,i:80,p:76,t:'美濃守護'},
{id:8,n:'稻葉一鐵',f:'齋藤',c:81,w:82,i:75,p:71,t:'堅守'},
{id:9,n:'安藤守就',f:'齋藤',c:77,w:70,i:80,p:76,t:'智將'},
{id:10,n:'今川義元',f:'今川',c:85,w:65,i:87,p:93,t:'東海道一弓取'},
{id:11,n:'松平元康',f:'今川',c:89,w:80,i:84,p:86,t:'三河武士'},
{id:12,n:'朝比奈泰朝',f:'今川',c:80,w:77,i:72,p:70,t:'忠臣'}];
const BASE=[['清洲','織田',2500,65,1],['犬山','織田',1300,50,2],['岐阜','齋藤',2300,75,7],['岩村','齋藤',1100,55,8],['岡崎','今川',2100,65,11],['吉田','今川',1400,50,12]];
const ROADS=[[0,1],[0,2],[0,4],[1,2],[2,3],[3,4],[4,5]],KEY='sengoku_v02_save';let g;
const officer=id=>OFFICERS.find(o=>o.id===id)||{id:0,n:'守城代官',f:'中立',c:50,w:50,i:50,p:50,t:'守備'};
const nearby=id=>ROADS.filter(r=>r.includes(id)).map(r=>r[0]===id?r[1]:r[0]);
const owned=()=>g.cities.filter(c=>c.owner==='織田');
const FACTIONS=['織田','齋藤','今川'];
const pair=(a,b)=>[a,b].sort().join('|');
function diplomacyDefaults(){return {relations:{[pair('織田','齋藤')]:-35,[pair('織田','今川')]:-45,[pair('齋藤','今川')]:5},alliances:{},truces:{},credit:100}}
function relation(a,b){return g.diplomacy.relations[pair(a,b)]??0}
function setRelation(a,b,v){g.diplomacy.relations[pair(a,b)]=Math.max(-100,Math.min(100,Math.round(v)))}
function active(t,a,b){return (g.diplomacy[t][pair(a,b)]||0)>g.turn}
function peaceful(a,b){return active('alliances',a,b)||active('truces',a,b)}
function fresh(){return{turn:1,gold:3000,rice:8000,selected:0,used:false,over:false,cities:BASE.map((x,id)=>({id,name:x[0],owner:x[1],troops:x[2],def:x[3],officer:x[4],farm:1,trade:1})),logs:['永祿三年春，織田家起兵。'],reserve:[],aiSupply:{'齋藤':2000,'今川':2000},diplomacy:diplomacyDefaults()}}
function normalize(){if(!g||!Array.isArray(g.cities)||g.cities.length!==6){g=fresh();return}if(!g.diplomacy||typeof g.diplomacy!=='object')g.diplomacy=diplomacyDefaults();let defaults=diplomacyDefaults();for(const k of ['relations','alliances','truces'])if(!g.diplomacy[k]||typeof g.diplomacy[k]!=='object')g.diplomacy[k]=defaults[k];for(const [k,v] of Object.entries(defaults.relations))if(!Number.isFinite(g.diplomacy.relations[k]))g.diplomacy.relations[k]=v;if(!Number.isFinite(g.diplomacy.credit))g.diplomacy.credit=100;g.logs=Array.isArray(g.logs)?g.logs:[];g.reserve=Array.isArray(g.reserve)?g.reserve:[];g.aiSupply=g.aiSupply||{'齋藤':2000,'今川':2000};g.uiSelections=g.uiSelections&&typeof g.uiSelections==='object'?g.uiSelections:{};g.selected=Number.isInteger(g.selected)&&g.selected>=0&&g.selected<6?g.selected:0;let seen=new Set();for(const c of g.cities){if(!OFFICERS.some(o=>o.id===c.officer)||seen.has(c.officer))c.officer=0;if(c.officer)seen.add(c.officer);c.troops=Math.max(0,Number(c.troops)||0)}g.reserve=[...new Set(g.reserve)].filter(id=>OFFICERS.some(o=>o.id===id)&&!seen.has(id));}
function selectedTarget(id){
 const el=document.getElementById(id);
 if(!el)return;
 if(!g.uiSelections||typeof g.uiSelections!=='object')g.uiSelections={};
 g.uiSelections[id]=el.value;
 save();
}
function optionSelected(id,value){
 return g.uiSelections&&String(g.uiSelections[id])===String(value)?' selected':'';
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(g))}catch(e){}}
function load(){try{g=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){g=fresh()}normalize();save();render()}
function log(s){g.logs.unshift(s);g.logs=g.logs.slice(0,35)}
function selectCity(id){g.selected=id;save();render()}
function ready(){if(g.over){alert('遊戲已結束');return false}return true}
function doDomesticAction(type){if(!ready())return;let c=g.cities[g.selected];if(c.owner!=='織田')return alert('只能管理織田家城池');let bonus=1+Math.max(0,officer(c.officer).p-60)/200;if(type==='farm'){if(g.gold<300)return alert('金錢不足');g.gold-=300;c.farm++;log(c.name+'開墾農田')}else if(type==='trade'){if(g.gold<350)return alert('金錢不足');g.gold-=350;c.trade++;log(c.name+'發展商業')}else if(type==='def'){if(c.def>=100)return alert('城防已達上限');if(g.gold<250)return alert('金錢不足');g.gold-=250;c.def=Math.min(100,c.def+12*bonus);log(c.name+'修築城防')}else if(type==='recruit'){if(g.gold<400||g.rice<300)return alert('資源不足');g.gold-=400;g.rice-=300;c.troops+=Math.round(500*bonus);log(c.name+'徵募足輕')}else return;save();render()}
function appoint(){if(!ready())return;let c=g.cities[g.selected];if(c.owner!=='織田')return;let el=document.getElementById('officers');if(!el||!el.value)return alert('目前沒有可任命的武將');let id=Number(el.value),o=officer(id);if(o.f!=='織田'||g.cities.some(x=>x.id!==c.id&&x.officer===id))return alert('該武將已在其他城池');if(c.officer===id)return alert('該武將已是本城城主');if(c.officer&&!g.reserve.includes(c.officer))g.reserve.push(c.officer);c.officer=id;g.reserve=g.reserve.filter(x=>x!==id);log(o.n+'就任'+c.name+'城主');save();render()}
function battle(a,b,n){let x=g.cities[a],y=g.cities[b];if(!x||!y||x.owner===y.owner||!nearby(a).includes(b)||peaceful(x.owner,y.owner))return false;n=Math.min(n,x.troops);if(n<100)return false;let o=officer(x.officer),d=officer(y.officer),atk=n*(.8+o.c/200)*(.85+Math.random()*.3)*(o.t==='鬼柴田'?1.15:1),def=y.troops*(.8+d.c/250)*(1+y.def/200)*(.85+Math.random()*.3),before=y.troops;let success=atk>def;let survivors=Math.max(0,Math.round(n*(success?.50:.22)));x.troops-=n;if(success){let former=y.owner,old=y.officer;y.owner=x.owner;y.troops=survivors;y.def=Math.max(20,y.def-20);y.officer=0;if(old&&!g.reserve.includes(old))g.reserve.push(old);log(o.n+'攻陷'+y.name+'（原屬'+former+'家）；守城代官暫管，新城駐兵'+survivors)}else{y.troops=Math.max(100,Math.round(before*.72));x.troops+=survivors;log(o.n+'進攻'+y.name+'失敗；攻方返回'+survivors+'兵，守軍剩'+y.troops)}return true}
function march(){if(!ready())return;let a=g.selected,c=g.cities[a],el=document.getElementById('target');if(c.owner!=='織田'||!el)return;let b=Number(el.value);selectedTarget('target');if(!nearby(a).includes(b)||g.cities[b].owner==='織田')return alert('無法進攻此城');if(peaceful(c.owner,g.cities[b].owner))return alert('同盟或停戰期間不可進攻');if(g.rice<500)return alert('兵糧不足');if(c.troops<300)return alert('兵力不足');let before=c.troops;g.rice-=500;let result=battle(a,b,Math.floor(c.troops*.65));if(!result)return;log('戰報：'+c.name+'出征前'+before+'兵，戰後'+c.troops+'兵；兵糧消耗500');check();save();render()}
function diplomacyAction(type){if(!ready())return;let el=document.getElementById('diplomacyTarget');if(!el)return;let target=el.value;selectedTarget('diplomacyTarget');if(!FACTIONS.includes(target)||target==='織田'||!g.cities.some(c=>c.owner===target))return alert('無效的外交對象');let rel=relation('織田',target),key=pair('織田',target),cost={improve:200,alliance:500,truce:300,break:0}[type];if(cost===undefined)return;if(g.gold<cost)return alert('金錢不足');if(type==='break'){if(!active('alliances','織田',target))return alert('目前沒有同盟');delete g.diplomacy.alliances[key];setRelation('織田',target,rel-30);g.diplomacy.credit=Math.max(0,g.diplomacy.credit-25);log('織田家解除與'+target+'家的同盟，外交信用下降')}else if(type==='improve'){g.gold-=cost;setRelation('織田',target,rel+15);log('派遣使者至'+target+'家，關係改善至'+relation('織田',target))}else if(type==='alliance'){if(active('alliances','織田',target))return alert('雙方已結盟');g.gold-=cost;let chance=Math.max(.05,Math.min(.9,.25+(rel+50)/200+g.diplomacy.credit/500));if(Math.random()<chance){g.diplomacy.alliances[key]=g.turn+6;delete g.diplomacy.truces[key];setRelation('織田',target,rel+10);log('織田與'+target+'締結六回合同盟！')}else log(target+'家拒絕結盟提議')}else if(type==='truce'){if(peaceful('織田',target))return alert('已有同盟或停戰');g.gold-=cost;let chance=Math.max(.1,Math.min(.9,.5+rel/250));if(Math.random()<chance){g.diplomacy.truces[key]=g.turn+3;log('織田與'+target+'達成三回合停戰')}else log(target+'家拒絕停戰提議')}save();render()}
function ai(){for(const owner of ['齋藤','今川']){if(!g.cities.some(c=>c.owner===owner))continue;let supply=Number(g.aiSupply[owner])||0;let cities=g.cities.filter(c=>c.owner===owner);let threatened=cities.some(c=>nearby(c.id).some(i=>g.cities[i].owner!==owner&&g.cities[i].troops>c.troops*1.2));for(const c of cities){supply+=Math.max(80,Math.round(c.farm*140));if(c.troops<(threatened?3500:2600)&&supply>=240){c.troops+=120;supply-=240}if(!threatened&&supply>=400&&c.farm<5&&Math.random()<.25){c.farm++;supply-=400}if(threatened&&supply>=350&&c.def<90){c.def=Math.min(100,c.def+8);supply-=350}}let candidates=cities.flatMap(c=>nearby(c.id).map(i=>({from:c,to:g.cities[i]}))).filter(x=>x.to.owner!==owner&&!peaceful(owner,x.to.owner)).sort((a,b)=>(a.to.troops/a.from.troops)-(b.to.troops/b.from.troops));if(candidates.length){let {from,to}=candidates[0];let temperament=owner==='齋藤'?2.25:1.65;if(from.troops>Math.max(800,to.troops*temperament)&&supply>=500&&Math.random()<(owner==='今川'?.5:.28)){supply-=500;battle(from.id,to.id,Math.floor(from.troops*.6));setRelation(owner,to.owner,relation(owner,to.owner)-12)}}if(threatened){let other=FACTIONS.filter(f=>f!==owner&&g.cities.some(c=>c.owner===f)).sort((a,b)=>relation(owner,b)-relation(owner,a))[0];if(other&&!peaceful(owner,other)&&relation(owner,other)>-25&&Math.random()<.16){g.diplomacy.truces[pair(owner,other)]=g.turn+3;log(owner+'家與'+other+'家達成暫時停戰')}}g.aiSupply[owner]=supply}}
function check(){if(!owned().length){g.over=true;log('織田家滅亡，遊戲結束')}else if(g.cities.every(c=>c.owner==='織田')){g.over=true;log('天下統一！織田家獲得勝利！')}}
function nextTurn(){if(g.over)return;for(const c of owned()){let bonus=1+Math.max(0,officer(c.officer).p-60)/200;g.gold+=Math.round(c.trade*180*bonus);g.rice+=Math.round(c.farm*550*bonus)-Math.ceil(c.troops/10)}g.rice=Math.max(0,g.rice);ai();g.turn++;for(const type of ['alliances','truces'])for(const [k,v] of Object.entries(g.diplomacy[type]))if(v<=g.turn){delete g.diplomacy[type][k];log(k.replace('|','與')+'的'+(type==='alliances'?'同盟':'停戰')+'期限已到')}check();log('進入第'+g.turn+'回合');save();render()}
function reset(){if(confirm('確定重新開始遊戲？此操作會覆蓋目前存檔')){g=fresh();save();render()}}

const MAP_POINTS=[
 {x:112,y:150},{x:117,y:102},{x:101,y:49},{x:231,y:70},{x:216,y:158},{x:291,y:166}
];
function castleIcon(x,y,owner,selected){
 let color=owner==='織田'?'#e5b65c':owner==='齋藤'?'#d47b87':'#88b6e8';
 return `<g class="marker" transform="translate(${x} ${y})">
 <path d="M-15 8H15V15H-15Z" fill="#cfc5a5"/>
 <path d="M-12 -2H12V9H-12Z" fill="#f2e5cc"/>
 <path d="M-9 -11H9V-1H-9Z" fill="#f2e5cc"/>
 <path d="M-5 -18H5V-10H-5Z" fill="#f2e5cc"/>
 <path d="M-18 -2L-11 -8H11L18 -2Z M-13 -11L-8 -16H8L13 -11Z M-8 -18L-4 -23H4L8 -18Z" fill="${color}"/>
 <path d="M-3 3H3V9H-3Z M-2 -8H2V-3H-2Z" fill="#35414c"/>
 </g>`;
}
function mapMarkup(year,season){
 let roads=ROADS.map(([a,b])=>`<line x1="${MAP_POINTS[a].x}" y1="${MAP_POINTS[a].y}" x2="${MAP_POINTS[b].x}" y2="${MAP_POINTS[b].y}" stroke="#e2c88d" stroke-width="2" stroke-dasharray="5 5" opacity=".7"/>`).join('');
 let nodes=g.cities.map(c=>{
 let {x,y}=MAP_POINTS[c.id];
 return `<g class="map-node ${c.id===g.selected?'selected':''}" tabindex="0" role="button" aria-label="${c.name} ${c.owner}家 ${c.troops}兵" onclick="selectCity(${c.id})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();selectCity(${c.id})}">
 <circle cx="${x}" cy="${y-4}" r="23" fill="${c.id===g.selected?'#ffe8a9':'#162b30'}" opacity="${c.id===g.selected?'.35':'.18'}"/>
 ${castleIcon(x,y-3,c.owner,c.id===g.selected)}
 <text class="map-label" x="${x}" y="${y+29}" text-anchor="middle">${c.name}</text>
 <text class="map-troops" x="${x}" y="${y+40}" text-anchor="middle">${c.troops}兵</text></g>`;
 }).join('');
 return `<svg class="map-scene" viewBox="0 0 340 222" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="尾張美濃三河六城示意地圖">
 <rect width="340" height="222" fill="#467b96"/>
 <!-- 中部地形：北側美濃山地、南側伊勢灣及三河灣（概略示意） -->

let mapIsOpen=false;
function openMap(){
 mapIsOpen=true;
 document.body.classList.add('map-open');
 const dlg=document.getElementById('mapDialog');
 dlg.classList.add('open');
 dlg.setAttribute('aria-hidden','false');
 refreshMapDialog();
 document.getElementById('mapClose').focus();
}
function closeMap(){
 mapIsOpen=false;
 document.body.classList.remove('map-open');
 const dlg=document.getElementById('mapDialog');
 dlg.classList.remove('open');
 dlg.setAttribute('aria-hidden','true');
 const btn=document.getElementById('openMapButton');
 if(btn)btn.focus({preventScroll:true});
}
function refreshMapDialog(){
 if(!mapIsOpen)return;
 const season=['春','夏','秋','冬'][(g.turn-1)%4],year=1560+Math.floor((g.turn-1)/4);
 document.getElementById('mapCanvas').innerHTML=mapMarkup(year,season);
 const c=g.cities[g.selected];
 document.getElementById('mapSelection').textContent=`目前選取：${c.name}城｜${c.owner}家｜${c.troops}兵`;
 document.getElementById('mapEra').textContent=`${year}年 ${season} · 尾張・美濃・三河`;
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&mapIsOpen)closeMap()});

function render(){let c=g.cities[g.selected],o=officer(c.officer),enemies=nearby(c.id).map(i=>g.cities[i]).filter(x=>x.owner!=='織田'),choices=OFFICERS.filter(x=>x.f==='織田'&&!g.cities.some(y=>y.id!==c.id&&y.officer===x.id)),season=['春','夏','秋','冬'][(g.turn-1)%4],year=1560+Math.floor((g.turn-1)/4);document.getElementById('game').innerHTML=`<div class="hud" id="hud"><div class="stats"><div class="stat ${g.gold<400?'low':''}">💰 軍資金<b>${g.gold.toLocaleString()}</b></div><div class="stat ${g.rice<500?'low':''}">🌾 兵糧<b>${g.rice.toLocaleString()}</b></div><div class="stat">⏳ 回合<b>${g.turn}</b></div></div></div><div class="map-launch"><div><strong>🗾 戰略地圖</strong><div class="hint">六城配置 · 點擊開啟全螢幕</div></div><button type="button" id="openMapButton" onclick="openMap()">查看地圖 ↗</button></div><section class="panel"><h2>🏯 ${c.name}城</h2><p>勢力：${c.owner}家　兵力：${c.troops}</p><p>城防：${Math.round(c.def)}　農業：${c.farm}　商業：${c.trade}</p><div class="officer"><b>⚔ ${o.n}</b><p>統率 ${o.c}｜武勇 ${o.w}</p><p>智略 ${o.i}｜政治 ${o.p}</p><small>固有特性：${o.t}</small></div>${c.owner==='織田'&&!g.over?`<p class="hint">本回合：不限次數行動 · 只受資源與兵力限制</p><h2>內政指令</h2><div class="actions"><button onclick="doDomesticAction('farm')">開墾 300金</button><button onclick="doDomesticAction('trade')">商業 350金</button><button onclick="doDomesticAction('def')">築城 250金</button><button onclick="doDomesticAction('recruit')">徵兵 400金</button></div><h2 style="margin-top:18px">武將任命</h2><select id="officers">${choices.map(x=>`<option value="${x.id}" ${x.id===c.officer?'selected':''}>${x.n}｜統率${x.c} 政治${x.p}</option>`).join('')}</select><button class="full" onclick="appoint()">任命城主</button><h2 style="margin-top:18px">軍事出征</h2>${enemies.length?`<select id="target" onchange="selectedTarget('target')">${enemies.map(x=>`<option value="${x.id}"${optionSelected('target',x.id)}>${x.name}｜${x.troops}兵</option>`).join('')}</select><button class="full" onclick="march()">⚔ 出征（500兵糧）</button>`:'<p>周圍沒有可進攻的敵城。</p>'}`:`<p class="hint">${g.over?'遊戲已結束':'此城目前不屬於織田家。'}</p>`}</section><section class="panel"><h2>🤝 外交評議</h2><p class="hint">外交信用：${g.diplomacy.credit}｜可不限次數交涉</p>${FACTIONS.filter(f=>f!=='織田'&&g.cities.some(c=>c.owner===f)).map(f=>`<p>${f}家：關係 ${relation('織田',f)}｜${active('alliances','織田',f)?'同盟至第'+g.diplomacy.alliances[pair('織田',f)]+'回合':active('truces','織田',f)?'停戰至第'+g.diplomacy.truces[pair('織田',f)]+'回合':'無條約'}</p>`).join('')}${!g.over?`<select id="diplomacyTarget" onchange="selectedTarget('diplomacyTarget')">${FACTIONS.filter(f=>f!=='織田'&&g.cities.some(c=>c.owner===f)).map(f=>`<option value="${f}"${optionSelected('diplomacyTarget',f)}>${f}家</option>`).join('')}</select><div class="actions"><button onclick="diplomacyAction('improve')">改善關係 200金</button><button onclick="diplomacyAction('alliance')">締結同盟 500金</button><button onclick="diplomacyAction('truce')">提出停戰 300金</button><button onclick="diplomacyAction('break')">解除同盟</button></div>`:''}</section><section class="panel"><h2>📜 戰國紀事</h2><div class="log">${g.logs.map(x=>`<div>• ${x}</div>`).join('')}</div></section>${g.over?`<section class="panel"><h2>${owned().length?'🎉 統一成功':'💀 遊戲結束'}</h2></section>`:''}<button class="full" onclick="nextTurn()" ${g.over?'disabled':''}>結束回合 →</button><button class="full" onclick="reset()">重新開始</button><p class="hint">V0.3.5 · 相容 V0.2 存檔 · 外交與大名 AI</p>`;refreshMapDialog()}
