<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#161c22"><meta name="apple-mobile-web-app-capable" content="yes"><title>戰國群雄錄 · 尾張風雲</title><style>
:root{--bg:#151b22;--panel:#26303b;--line:#657078;--gold:#f3ce82;--text:#f4ecd6;--muted:#b7b9ad}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:ui-monospace,'Courier New',monospace;font-weight:bold;touch-action:manipulation}#app{max-width:550px;margin:auto;min-height:100dvh;padding:env(safe-area-inset-top) 12px calc(env(safe-area-inset-bottom) + 20px)}header{text-align:center;padding:13px 0 8px;border-bottom:3px double var(--gold)}h1{font-size:25px;letter-spacing:3px;margin:0;color:var(--gold);text-shadow:2px 2px #7c4137}.sub{font-size:12px;color:var(--muted);margin-top:5px}.top{display:flex;justify-content:space-between;gap:8px;margin:12px 0}.chip{background:#303b45;border:2px solid #63707b;padding:7px 9px;font-size:12px;flex:1;text-align:center}.chip b{color:var(--gold);display:block;font-size:16px;margin-top:3px}.map{position:relative;background:#344c4a;border:4px solid #8b846b;aspect-ratio:1.13;overflow:hidden;box-shadow:inset 0 0 0 4px #1e2f32}.map:before{content:'';position:absolute;inset:0;opacity:.3;background:repeating-linear-gradient(0deg,transparent 0 19px,#152d30 20px 21px),repeating-linear-gradient(90deg,transparent 0 19px,#152d30 20px 21px);pointer-events:none}.map svg{width:100%;height:100%;position:absolute;inset:0}.city{position:absolute;transform:translate(-50%,-50%);border:2px solid #eee1b2;background:#20272e;color:white;padding:5px 6px;font-size:11px;min-width:69px;cursor:pointer;box-shadow:3px 3px #111b21}.city.oda{background:#375f8a}.city.saito{background:#7b5a94}.city.imagawa{background:#9a5352}.city.sel{outline:3px solid #ffd46b;z-index:3}.city .tower{font-size:20px;display:block;line-height:21px}.legend{font-size:11px;color:#e2d9c1;margin:6px 0 11px;text-align:center}.panel{background:var(--panel);border:3px solid #78808a;padding:12px;margin-top:10px;box-shadow:4px 4px #0c1116}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.heading{font-size:18px;color:var(--gold)}.small{font-size:12px;color:var(--muted);line-height:1.65}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.stat{background:#18212a;padding:8px 3px;text-align:center;font-size:11px;color:#b9c3c3}.stat b{display:block;color:#f8ebce;font-size:16px;margin-top:4px}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}button{font:inherit;cursor:pointer;border-radius:0;border:2px solid #d3b27a;background:#665035;color:#fff2d2;padding:12px 5px;min-height:45px;box-shadow:3px 3px #12171a}button:active{transform:translate(2px,2px);box-shadow:1px 1px #12171a}button:disabled{opacity:.42;cursor:not-allowed}.primary{background:#80643b}.danger{background:#7c4540}.quiet{background:#364650;border-color:#8395a1}.full{width:100%;margin-top:10px}.log{font-size:12px;line-height:1.7;color:#d6d6c4;max-height:145px;overflow:auto}.log div{border-bottom:1px dashed #53606a;padding:4px 0}.footer{display:flex;gap:8px;margin-top:12px}.footer button{flex:1;font-size:12px}.win{color:#ffda82}.lose{color:#ff9999}.note{font-size:11px;color:#b9b9ae;text-align:center;margin:12px 0}.hidden{display:none}#overlay{position:fixed;inset:0;background:#071017d9;display:flex;align-items:center;justify-content:center;padding:18px;z-index:10}#overlay.hidden{display:none}.modal{max-width:430px;width:100%;background:#283441;border:4px solid #d2b77c;padding:22px;text-align:center}.modal h2{color:#f5ce7d;margin:0 0 12px}.modal p{font-size:13px;line-height:1.8}.modal button{width:100%;margin-top:8px}@media(max-width:370px){.city{min-width:60px;font-size:10px;padding:4px 2px}.chip{padding:6px 3px}.map{aspect-ratio:1.05}}
</style></head><body><div id="app"><header><h1>⚔ 戰國群雄錄 ⚔</h1><div class="sub">尾張風雲 · 永祿三年</div></header><div class="top"><div class="chip">年月<b id="date"></b></div><div class="chip">軍資金<b id="gold"></b></div><div class="chip">兵糧<b id="rice"></b></div></div><div class="map" id="map"><svg viewBox="0 0 400 360" preserveAspectRatio="none" aria-hidden="true"><path d="M5 20 L100 5 L167 50 L236 25 L390 15 L380 110 L315 145 L285 190 L210 168 L160 210 L65 182 L8 120 Z" fill="#728565" stroke="#c5b78d" stroke-width="3"/><path d="M0 208 L75 190 L160 210 L210 168 L285 190 L310 270 L248 345 L155 335 L85 292 L0 300 Z" fill="#779376" stroke="#c5b78d" stroke-width="3"/><path d="M285 190 L315 145 L390 110 L400 320 L335 350 L248 345 L310 270 Z" fill="#83936d" stroke="#c5b78d" stroke-width="3"/><path d="M40 70 Q100 100 170 130 T330 240" fill="none" stroke="#9dbab0" stroke-width="8" opacity=".75"/><path d="M150 210 L210 168 M210 168 L315 145 M210 168 L285 190 M285 190 L310 270 M150 210 L85 292 M315 145 L380 110" stroke="#e3d6a0" stroke-dasharray="5 5" stroke-width="2"/></svg></div><div class="legend">🟦 織田　🟪 齋藤　🟥 今川　｜ 點擊城池選擇</div><section class="panel"><div class="row"><div><div class="heading" id="cityname"></div><div class="small" id="owner"></div></div><div class="small" id="officer"></div></div><div class="stats"><div class="stat">兵力<b id="troops"></b></div><div class="stat">石高<b id="farm"></b></div><div class="stat">城防<b id="defense"></b></div></div><div class="small" id="detail"></div><div class="actions" id="actions"></div></section><section class="panel"><div class="row"><span class="heading">軍議記錄</span><span class="small" id="turns"></span></div><div class="log" id="log"></div></section><div class="footer"><button class="quiet" onclick="saveGame()">💾 存檔</button><button class="quiet" onclick="loadGame()">📂 讀檔</button><button class="primary" onclick="nextTurn()">⏭ 結束回合</button></div><div class="note">離線單機 · 自動戰鬥 · 目標：統一全部城池</div></div><div id="overlay"><div class="modal"><h2 id="modalTitle">戰國群雄錄</h2><p id="modalText">永祿三年，天下未定。<br>你將扮演織田信長，以清洲城為據點，爭奪天下。<br><br>每回合可發展城池、徵兵或出征。<br>佔領全部城池即獲勝！</p><button onclick="closeModal()">出陣！</button><button class="quiet" id="resume" onclick="loadGame();closeModal()">繼續上次進度</button></div></div><script>
'use strict';const KEY='sengoku_v01_save';const initial=[{id:0,name:'清洲城',x:36,y:61,owner:'oda',troops:2600,farm:4,trade:2,defense:2,officer:'織田信長',neighbors:[1,2,3]},{id:1,name:'岐阜城',x:36,y:22,owner:'saito',troops:2800,farm:4,trade:2,defense:3,officer:'齋藤龍興',neighbors:[0,2,4]},{id:2,name:'犬山城',x:57,y:41,owner:'saito',troops:1400,farm:3,trade:1,defense:2,officer:'齋藤家臣',neighbors:[0,1,3,4]},{id:3,name:'岡崎城',x:64,y:76,owner:'imagawa',troops:1800,farm:3,trade:2,defense:2,officer:'松平元康',neighbors:[0,2,5]},{id:4,name:'岩村城',x:79,y:24,owner:'saito',troops:1100,farm:2,trade:1,defense:3,officer:'遠山家臣',neighbors:[1,2,5]},{id:5,name:'吉田城',x:86,y:59,owner:'imagawa',troops:1800,farm:3,trade:2,defense:2,officer:'今川家臣',neighbors:[3,4]}];let state,selected=0;const names={oda:'織田家',saito:'齋藤家',imagawa:'今川家'};const $=id=>document.getElementById(id);const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;const format=n=>Math.floor(n).toLocaleString('zh-TW');function fresh(){state={cities:structuredClone(initial),gold:3200,rice:7500,turn:1,actions:3,logs:['永祿三年春，織田信長於清洲城舉兵。'],ended:false};selected=0}function log(s){state.logs.unshift(s);state.logs=state.logs.slice(0,35)}function owned(){return state.cities.filter(c=>c.owner==='oda')}function city(){return state.cities[selected]}function render(){let year=1560+Math.floor((state.turn-1)/4),season=['春','夏','秋','冬'][(state.turn-1)%4];$('date').textContent=year+' '+season;$('gold').textContent=format(state.gold);$('rice').textContent=format(state.rice);$('turns').textContent='剩餘指令 '+state.actions;$('map').querySelectorAll('button').forEach(b=>b.remove());state.cities.forEach(c=>{let b=document.createElement('button');b.className='city '+c.owner+(selected===c.id?' sel':'');b.style.left=c.x+'%';b.style.top=c.y+'%';b.innerHTML='<span class="tower">🏯</span>'+c.name;b.onclick=()=>{selected=c.id;render()};$('map').append(b)});let c=city();$('cityname').textContent=c.name;$('owner').textContent=names[c.owner];$('officer').textContent=c.officer;$('troops').textContent=format(c.troops);$('farm').textContent=c.farm+' 級';$('defense').textContent=c.defense+' 級';$('detail').textContent='商業 '+c.trade+' 級 · 相鄰城池：'+c.neighbors.map(i=>state.cities[i].name).join('、');let a=$('actions');a.innerHTML='';const add=(label,fn,enabled=true,cl='')=>{let b=document.createElement('button');b.textContent=label;b.className=cl;b.disabled=!enabled||state.ended;b.onclick=fn;a.append(b)};if(c.owner==='oda'){let ok=state.actions>0;add('🌾 開墾 500金',()=>develop('farm'),ok&&state.gold>=500&&c.farm<8);add('🪙 商業 500金',()=>develop('trade'),ok&&state.gold>=500&&c.trade<8);add('🛡 修築 400金',()=>develop('defense'),ok&&state.gold>=400&&c.defense<8);add('⚔ 徵兵 600金',recruit,ok&&state.gold>=600&&state.rice>=500);let targets=c.neighbors.filter(i=>state.cities[i].owner!=='oda');if(targets.length){add('🔥 出征鄰城',()=>chooseTarget(c.id),ok&&c.troops>=500&&state.rice>=500,'danger')}else add('✓ 周邊已平定',()=>{},false)}else{let adjacent=c.neighbors.some(i=>state.cities[i].owner==='oda');add(adjacent?'⚔ 改選我方城出征':'🔒 尚未接壤',()=>{let own=c.neighbors.find(i=>state.cities[i].owner==='oda');if(own!==undefined){selected=own;render()}},adjacent)}$('log').innerHTML=state.logs.map(s=>'<div>'+escapeHTML(s)+'</div>').join('')}function escapeHTML(s){return String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}function spend(){state.actions--;render()}function develop(type){let c=city(),cost=type==='defense'?400:500;if(c.owner!=='oda'||state.actions<=0||state.gold<cost||c[type]>=8)return;state.gold-=cost;c[type]++;log(c.name+(type==='farm'?'開墾農田':type==='trade'?'發展商業':'修築城防')+'，提升至 '+c[type]+' 級。');spend()}function recruit(){let c=city();if(c.owner!=='oda'||state.actions<=0||state.gold<600||state.rice<500)return;state.gold-=600;state.rice-=500;c.troops+=800;log(c.name+'徵募足輕 800 人。');spend()}function chooseTarget(from){let src=state.cities[from],targets=src.neighbors.filter(i=>state.cities[i].owner!=='oda');if(!targets.length)return;let text='選擇目標：\n'+targets.map((i,n)=>(n+1)+'. '+state.cities[i].name+'（'+format(state.cities[i].troops)+'兵）').join('\n');let val=prompt(text,'1');if(val===null)return;let idx=Number(val)-1;if(!Number.isInteger(idx)||idx<0||idx>=targets.length){alert('請輸入有效編號');return}let dest=state.cities[targets[idx]];let qty=prompt('從'+src.name+'出兵攻打'+dest.name+'\n可用兵力 '+src.troops+'（至少留守 300）\n輸入出兵數量',String(Math.max(0,src.troops-300)));if(qty===null)return;let n=Number(qty);if(!Number.isInteger(n)||n<500||n>src.troops-300){alert('出兵數量無效，需至少 500 且留守 300。');return}battle(src,dest,n,true)}function battle(src,dst,n,player){let riceCost=Math.ceil(n*.3);if(player){if(state.rice<riceCost){alert('兵糧不足，需要 '+riceCost);return}state.rice-=riceCost;state.actions--}src.troops-=n;let attack=n*(.8+Math.random()*.55)*(player?1.12:1);let defend=dst.troops*(.75+Math.random()*.45)*(1+dst.defense*.07);let winner=attack>defend;let attackerLoss=Math.min(n,Math.round(n*(winner?rand(20,42):rand(45,75))/100));let defenderLoss=Math.min(dst.troops,Math.round(dst.troops*(winner?rand(65,90):rand(20,55))/100));dst.troops-=defenderLoss;if(winner){let prev=dst.owner;dst.owner=src.owner;dst.troops=Math.max(180,n-attackerLoss);dst.defense=Math.max(1,dst.defense-1);dst.officer=player?'織田家臣':names[src.owner]+'家臣';log((player?'我軍':'敵軍')+'攻陷'+dst.name+'！'+names[prev]+'敗退。')}else{src.troops+=Math.max(0,n-attackerLoss);log((player?'我軍':'敵軍')+'進攻'+dst.name+'失利，折損'+format(attackerLoss)+'兵。')}selected=player?src.id:selected;checkEnd();render()}function nextTurn(){if(state.ended)return;state.turn++;let income=0,food=0,consumption=0;owned().forEach(c=>{income+=c.trade*160+80;food+=c.farm*400;consumption+=Math.ceil(c.troops*.13)});state.gold+=income;state.rice+=food-consumption;if(state.rice<0){let shortage=-state.rice;state.rice=0;owned().forEach(c=>c.troops=Math.max(100,c.troops-Math.ceil(shortage/owned().length/3)));log('兵糧短缺，部分士兵逃散！')}log('回合結算：獲得'+format(income)+'金、'+format(food)+'糧；消耗'+format(consumption)+'糧。');for(let faction of ['saito','imagawa']){let holdings=state.cities.filter(c=>c.owner===faction);if(!holdings.length)continue;holdings.forEach(c=>{c.troops+=rand(130,310);if(Math.random()<.16)c.defense=Math.min(7,c.defense+1)});if(Math.random()<.55){let candidates=holdings.flatMap(c=>c.neighbors.filter(i=>state.cities[i].owner!==faction).map(i=>({src:c,dst:state.cities[i]}))).filter(x=>x.src.troops>=900);if(candidates.length){let p=candidates[rand(0,candidates.length-1)],n=Math.floor(p.src.troops*.65);battle(p.src,p.dst,n,false)}}}state.actions=3;checkEnd();render();saveSilent()}function checkEnd(){let factions=new Set(state.cities.map(c=>c.owner));if(factions.size===1){state.ended=true;let won=factions.has('oda');log(won?'天下統一！織田家平定六城！':'織田家滅亡，天下之夢破碎。');setTimeout(()=>showModal(won?'天下統一！':'敗北','本局共經歷 '+state.turn+' 個回合。\n'+(won?'你成功平定尾張、美濃與三河周邊！':'清洲陷落，請重新整軍再戰。'),'重新開始',()=>{fresh();render();saveSilent();closeModal()}),100)}}function saveSilent(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}function saveGame(){saveSilent();alert('已儲存目前進度於此瀏覽器。')}function loadGame(){try{let s=JSON.parse(localStorage.getItem(KEY));if(!s||!Array.isArray(s.cities)||s.cities.length!==6)throw Error();state=s;selected=0;render();alert('已讀取進度。')}catch(e){alert('找不到有效存檔。')}}function showModal(title,msg,button,fn){$('modalTitle').textContent=title;$('modalText').textContent=msg;let b=$('overlay').querySelector('button');b.textContent=button;b.onclick=fn;$('resume').style.display='none';$('overlay').classList.remove('hidden')}function closeModal(){$('overlay').classList.add('hidden')}fresh();render();$('resume').style.display=localStorage.getItem(KEY)?'block':'none';
</script></body></html>
