<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>戰國群雄錄 V0.2.1</title><style>*{box-sizing:border-box}body{margin:0;background:#171e28;color:#f2e5c5;font-family:system-ui}header{text-align:center;background:#293447;padding:16px;border-bottom:3px solid #c6a268}h1{font-size:25px;color:#f6d28a;margin:0}small,.hint{color:#bcb9ae}main{max-width:560px;margin:auto;padding:12px}.panel{background:#283445;border:2px solid #647082;padding:13px;margin:12px 0;border-radius:5px}h2{font-size:18px;color:#f6d28a;margin:0 0 12px}.stats,.map,.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stats{grid-template-columns:repeat(3,1fr)}.stat{text-align:center;background:#192533;padding:10px 3px;font-size:12px}.stat b{display:block;color:#f6d28a;font-size:18px}button,select{font:inherit}button{background:#725936;border:2px solid #c9a46b;color:#fff0d0;padding:11px 5px;border-radius:4px;cursor:pointer}button:disabled{opacity:.35}.castle{background:#26394b;min-height:75px}.castle.enemy{background:#563b48}.castle.active{outline:3px solid #f6d28a}.castle strong{display:block}.castle span{font-size:12px}.full{width:100%;margin-top:10px}.officer{background:#192533;padding:11px;margin:9px 0;border-left:4px solid #c9a46b}.officer b{color:#f6d28a}select{width:100%;padding:10px;background:#192533;color:white;border:1px solid #8893a0;margin:8px 0}.log{font-size:13px;line-height:1.8;max-height:220px;overflow:auto}.hint{font-size:12px}</style></head><body><header><h1>⚔ 戰國群雄錄 ⚔</h1><small>V0.2.1 武將與戰爭系統優化</small></header><main id="game"></main><script>
'use strict';
const OFFICERS=[
{id:1,n:'織田信長',f:'織田',c:92,w:85,i:91,p:96,t:'天下布武'},
{id:2,n:'柴田勝家',f:'織田',c:88,w:94,i:65,p:58,t:'鬼柴田'},
{id:3,n:'丹羽長秀',f:'織田',c:78,w:68,i:82,p:89,t:'米五郎左'},
{id:4,n:'池田恆興',f:'織田',c:75,w:76,i:71,p:69,t:'忠義'},
{id:5,n:'森可成',f:'織田',c:82,w:88,i:67,p:61,t:'攻勢'},
{id:6,n:'佐久間信盛',f:'織田',c:76,w:69,i:70,p:73,t:'守備'},
{id:7,n:'齋藤義龍',f:'齋藤',c:84,w:78,i:80,p:76,t:'美濃守護'},
{id:8,n:'稻葉一鐵',f:'齋藤',c:81,w:82,i:75,p:71,t:'堅守'},
{id:9,n:'安藤守就',f:'齋藤',c:77,w:70,i:80,p:76,t:'智將'},
{id:10,n:'今川義元',f:'今川',c:85,w:65,i:87,p:93,t:'東海道一弓取'},
{id:11,n:'松平元康',f:'今川',c:89,w:80,i:84,p:86,t:'三河武士'},
{id:12,n:'朝比奈泰朝',f:'今川',c:80,w:77,i:72,p:70,t:'忠臣'}];
const BASE=[['清洲','織田',2500,65,1],['犬山','織田',1300,50,2],['岐阜','齋藤',2300,75,7],['岩村','齋藤',1100,55,8],['岡崎','今川',2100,65,11],['吉田','今川',1400,50,12]];
const ROADS=[[0,1],[0,2],[0,4],[1,2],[2,3],[3,4],[4,5]],KEY='sengoku_v02_save';let g;
const officer=id=>OFFICERS.find(o=>o.id===id)||{id:0,n:'守城代官',f:'中立',c:50,w:50,i:50,p:50,t:'守備'};
const nearby=id=>ROADS.filter(r=>r.includes(id)).map(r=>r[0]===id?r[1]:r[0]);
const owned=()=>g.cities.filter(c=>c.owner==='織田');
function fresh(){return{turn:1,gold:3000,rice:8000,selected:0,used:false,over:false,cities:BASE.map((x,id)=>({id,name:x[0],owner:x[1],troops:x[2],def:x[3],officer:x[4],farm:1,trade:1})),logs:['永祿三年春，織田家起兵。'],reserve:[],aiSupply:{'齋藤':2000,'今川':2000}}}
function normalize(){if(!g||!Array.isArray(g.cities)||g.cities.length!==6){g=fresh();return}g.logs=Array.isArray(g.logs)?g.logs:[];g.reserve=Array.isArray(g.reserve)?g.reserve:[];g.aiSupply=g.aiSupply||{'齋藤':2000,'今川':2000};g.selected=Number.isInteger(g.selected)&&g.selected>=0&&g.selected<6?g.selected:0;let seen=new Set();for(const c of g.cities){if(!OFFICERS.some(o=>o.id===c.officer)||seen.has(c.officer))c.officer=0;if(c.officer)seen.add(c.officer);c.troops=Math.max(0,Number(c.troops)||0)}g.reserve=[...new Set(g.reserve)].filter(id=>OFFICERS.some(o=>o.id===id)&&!seen.has(id));}
function save(){try{localStorage.setItem(KEY,JSON.stringify(g))}catch(e){}}
function load(){try{g=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){g=fresh()}normalize();save();render()}
function log(s){g.logs.unshift(s);g.logs=g.logs.slice(0,35)}
function selectCity(id){g.selected=id;save();render()}
function ready(){if(g.over){alert('遊戲已結束');return false}if(g.used){alert('本回合已行動，請先結束回合');return false}return true}
function doDomesticAction(type){if(!ready())return;let c=g.cities[g.selected];if(c.owner!=='織田')return alert('只能管理織田家城池');let bonus=1+Math.max(0,officer(c.officer).p-60)/200;if(type==='farm'){if(g.gold<300)return alert('金錢不足');g.gold-=300;c.farm++;log(c.name+'開墾農田')}else if(type==='trade'){if(g.gold<350)return alert('金錢不足');g.gold-=350;c.trade++;log(c.name+'發展商業')}else if(type==='def'){if(g.gold<250)return alert('金錢不足');g.gold-=250;c.def=Math.min(100,c.def+12*bonus);log(c.name+'修築城防')}else if(type==='recruit'){if(g.gold<400||g.rice<300)return alert('資源不足');g.gold-=400;g.rice-=300;c.troops+=Math.round(500*bonus);log(c.name+'徵募足輕')}else return;g.used=true;save();render()}
function appoint(){if(!ready())return;let c=g.cities[g.selected];if(c.owner!=='織田')return;let el=document.getElementById('officers');if(!el||!el.value)return alert('目前沒有可任命的武將');let id=Number(el.value),o=officer(id);if(o.f!=='織田'||g.cities.some(x=>x.id!==c.id&&x.officer===id))return alert('該武將已在其他城池');if(c.officer===id)return alert('該武將已是本城城主');if(c.officer&&!g.reserve.includes(c.officer))g.reserve.push(c.officer);c.officer=id;g.reserve=g.reserve.filter(x=>x!==id);g.used=true;log(o.n+'就任'+c.name+'城主');save();render()}
function battle(a,b,n){let x=g.cities[a],y=g.cities[b];if(!x||!y||x.owner===y.owner||!nearby(a).includes(b))return false;n=Math.min(n,x.troops);if(n<100)return false;let o=officer(x.officer),d=officer(y.officer),atk=n*(.8+o.c/200)*(.85+Math.random()*.3)*(o.t==='鬼柴田'?1.15:1),def=y.troops*(.8+d.c/250)*(1+y.def/200)*(.85+Math.random()*.3),before=y.troops;let success=atk>def;let survivors=Math.max(0,Math.round(n*(success?.50:.22)));x.troops-=n;if(success){let former=y.owner,old=y.officer;y.owner=x.owner;y.troops=survivors;y.def=Math.max(20,y.def-20);y.officer=0;if(old&&!g.reserve.includes(old))g.reserve.push(old);log(o.n+'攻陷'+y.name+'（原屬'+former+'家）；守城代官暫管，新城駐兵'+survivors)}else{y.troops=Math.max(100,Math.round(before*.72));x.troops+=survivors;log(o.n+'進攻'+y.name+'失敗；攻方返回'+survivors+'兵，守軍剩'+y.troops)}return true}
function march(){if(!ready())return;let a=g.selected,c=g.cities[a],el=document.getElementById('target');if(c.owner!=='織田'||!el)return;let b=Number(el.value);if(!nearby(a).includes(b)||g.cities[b].owner==='織田')return alert('無法進攻此城');if(g.rice<500)return alert('兵糧不足');if(c.troops<300)return alert('兵力不足');let before=c.troops;g.rice-=500;let result=battle(a,b,Math.floor(c.troops*.65));if(!result)return;log('戰報：'+c.name+'出征前'+before+'兵，戰後'+c.troops+'兵；兵糧消耗500');g.used=true;check();save();render()}
function ai(){for(const owner of ['齋藤','今川']){let supply=g.aiSupply[owner];for(const c of g.cities.filter(x=>x.owner===owner)){supply+=Math.max(60,Math.round(c.farm*140));if(c.troops<2400&&supply>=240){c.troops+=120;supply-=240}let enemies=nearby(c.id).map(i=>g.cities[i]).filter(x=>x.owner!==owner).sort((a,b)=>a.troops-b.troops);if(enemies.length&&supply>=500&&c.troops>enemies[0].troops*1.8&&Math.random()<.25){supply-=500;battle(c.id,enemies[0].id,Math.floor(c.troops*.6))}}g.aiSupply[owner]=supply}}
function check(){if(!owned().length){g.over=true;log('織田家滅亡，遊戲結束')}else if(g.cities.every(c=>c.owner==='織田')){g.over=true;log('天下統一！織田家獲得勝利！')}}
function nextTurn(){if(g.over)return;for(const c of owned()){let bonus=1+Math.max(0,officer(c.officer).p-60)/200;g.gold+=Math.round(c.trade*180*bonus);g.rice+=Math.round(c.farm*550*bonus)-Math.ceil(c.troops/10)}g.rice=Math.max(0,g.rice);ai();g.turn++;g.used=false;check();log('進入第'+g.turn+'回合');save();render()}
function reset(){if(confirm('確定重新開始遊戲？此操作會覆蓋目前存檔')){g=fresh();save();render()}}
function render(){let c=g.cities[g.selected],o=officer(c.officer),enemies=nearby(c.id).map(i=>g.cities[i]).filter(x=>x.owner!=='織田'),choices=OFFICERS.filter(x=>x.f==='織田'&&!g.cities.some(y=>y.id!==c.id&&y.officer===x.id)),season=['春','夏','秋','冬'][(g.turn-1)%4],year=1560+Math.floor((g.turn-1)/4);document.getElementById('game').innerHTML=`<div class="stats"><div class="stat">軍資金<b>${g.gold}</b></div><div class="stat">兵糧<b>${g.rice}</b></div><div class="stat">回合<b>${g.turn}</b></div></div><section class="panel"><h2>${year}年 ${season} · 戰略地圖</h2><div class="map">${g.cities.map(x=>`<button class="castle ${x.owner==='織田'?'':'enemy'} ${x.id===g.selected?'active':''}" onclick="selectCity(${x.id})"><strong>${x.name}</strong><span>${x.owner}家 · ${x.troops}兵</span></button>`).join('')}</div></section><section class="panel"><h2>🏯 ${c.name}城</h2><p>勢力：${c.owner}家　兵力：${c.troops}</p><p>城防：${Math.round(c.def)}　農業：${c.farm}　商業：${c.trade}</p><div class="officer"><b>⚔ ${o.n}</b><p>統率 ${o.c}｜武勇 ${o.w}</p><p>智略 ${o.i}｜政治 ${o.p}</p><small>固有特性：${o.t}</small></div>${c.owner==='織田'&&!g.over?`<p class="hint">本回合：${g.used?'已行動，請結束回合':'可執行 1 次行動'}</p><h2>內政指令</h2><div class="actions"><button onclick="doDomesticAction('farm')" ${g.used?'disabled':''}>開墾 300金</button><button onclick="doDomesticAction('trade')" ${g.used?'disabled':''}>商業 350金</button><button onclick="doDomesticAction('def')" ${g.used?'disabled':''}>築城 250金</button><button onclick="doDomesticAction('recruit')" ${g.used?'disabled':''}>徵兵 400金</button></div><h2 style="margin-top:18px">武將任命</h2><select id="officers">${choices.map(x=>`<option value="${x.id}" ${x.id===c.officer?'selected':''}>${x.n}｜統率${x.c} 政治${x.p}</option>`).join('')}</select><button class="full" onclick="appoint()" ${g.used?'disabled':''}>任命城主</button><h2 style="margin-top:18px">軍事出征</h2>${enemies.length?`<select id="target">${enemies.map(x=>`<option value="${x.id}">${x.name}｜${x.troops}兵</option>`).join('')}</select><button class="full" onclick="march()" ${g.used?'disabled':''}>⚔ 出征（500兵糧）</button>`:'<p>周圍沒有可進攻的敵城。</p>'}`:`<p class="hint">${g.over?'遊戲已結束':'此城目前不屬於織田家。'}</p>`}</section><section class="panel"><h2>📜 戰國紀事</h2><div class="log">${g.logs.map(x=>`<div>• ${x}</div>`).join('')}</div></section>${g.over?`<section class="panel"><h2>${owned().length?'🎉 統一成功':'💀 遊戲結束'}</h2></section>`:''}<button class="full" onclick="nextTurn()" ${g.over?'disabled':''}>結束回合 →</button><button class="full" onclick="reset()">重新開始</button><p class="hint">V0.2.1 · 沿用 V0.2 Safari 自動存檔</p>`}
load();
</script></body></html>
