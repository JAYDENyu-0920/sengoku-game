
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#171e28">
<title>戰國群雄錄 V0.2</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#171e28;color:#f2e5c5;font-family:system-ui,sans-serif}
header{text-align:center;background:#293447;padding:17px;border-bottom:3px solid #c6a268}
h1{font-size:25px;color:#f6d28a;margin:0}
small{color:#bcb9ae}
main{max-width:560px;margin:auto;padding:12px}
.panel{background:#283445;border:2px solid #647082;padding:13px;margin:12px 0;border-radius:5px}
h2{font-size:18px;color:#f6d28a;margin:0 0 12px}
.stats,.map,.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stats{grid-template-columns:repeat(3,1fr)}
.stat{text-align:center;background:#192533;padding:10px 3px;font-size:12px}
.stat b{display:block;color:#f6d28a;font-size:18px}
button,select{font:inherit}
button{background:#725936;border:2px solid #c9a46b;color:#fff0d0;padding:11px 5px;border-radius:4px;cursor:pointer}
button:disabled{opacity:.35}
.castle{background:#26394b;min-height:75px}
.castle.enemy{background:#563b48}
.castle.active{outline:3px solid #f6d28a}
.castle strong{display:block}
.castle span{font-size:12px}
.full{width:100%;margin-top:10px}
.officer{background:#192533;padding:11px;margin:9px 0;border-left:4px solid #c9a46b}
.officer b{color:#f6d28a}
select{width:100%;padding:10px;background:#192533;color:white;border:1px solid #8893a0;margin:8px 0}
.log{font-size:13px;line-height:1.8;max-height:190px;overflow:auto}
.notice{font-size:12px;color:#bcb9ae}
</style>
</head>
<body>
<header>
<h1>⚔ 戰國群雄錄 ⚔</h1>
<small>V0.2 群雄列傳 · 永祿三年</small>
</header>
<main id="game"></main>
<script>
const OFFICERS=[
{id:1,n:"織田信長",f:"織田",c:92,w:85,i:91,p:96,t:"天下布武"},
{id:2,n:"柴田勝家",f:"織田",c:88,w:94,i:65,p:58,t:"鬼柴田"},
{id:3,n:"丹羽長秀",f:"織田",c:78,w:68,i:82,p:89,t:"米五郎左"},
{id:4,n:"池田恆興",f:"織田",c:75,w:76,i:71,p:69,t:"忠義"},
{id:5,n:"森可成",f:"織田",c:82,w:88,i:67,p:61,t:"攻勢"},
{id:6,n:"佐久間信盛",f:"織田",c:76,w:69,i:70,p:73,t:"守備"},
{id:7,n:"齋藤義龍",f:"齋藤",c:84,w:78,i:80,p:76,t:"美濃守護"},
{id:8,n:"稻葉一鐵",f:"齋藤",c:81,w:82,i:75,p:71,t:"堅守"},
{id:9,n:"安藤守就",f:"齋藤",c:77,w:70,i:80,p:76,t:"智將"},
{id:10,n:"今川義元",f:"今川",c:85,w:65,i:87,p:93,t:"東海道一弓取"},
{id:11,n:"松平元康",f:"今川",c:89,w:80,i:84,p:86,t:"三河武士"},
{id:12,n:"朝比奈泰朝",f:"今川",c:80,w:77,i:72,p:70,t:"忠臣"}
];
const BASE=[
["清洲","織田",2500,65,1],
["犬山","織田",1300,50,2],
["岐阜","齋藤",2300,75,7],
["岩村","齋藤",1100,55,8],
["岡崎","今川",2100,65,11],
["吉田","今川",1400,50,12]
];
const ROADS=[[0,1],[0,2],[0,4],[1,2],[2,3],[3,4],[4,5]];
const KEY="sengoku_v02_save";
let g;
function fresh(){
return {
turn:1,gold:3000,rice:8000,selected:0,used:false,over:false,
cities:BASE.map((x,id)=>({
id,name:x[0],owner:x[1],troops:x[2],def:x[3],
officer:x[4],farm:1,trade:1
})),
logs:["永祿三年春，織田家起兵。"]
};
}
function officer(id){return OFFICERS.find(o=>o.id===id)}
function nearby(id){
return ROADS.filter(r=>r.includes(id)).map(r=>r[0]===id?r[1]:r[0]);
}
function save(){
try{localStorage.setItem(KEY,JSON.stringify(g))}catch(e){}
}
function load(){
try{g=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){g=fresh()}
render();
}
function log(s){g.logs.unshift(s);g.logs=g.logs.slice(0,30)}
function selectCity(id){g.selected=id;save();render()}
function own(){return g.cities.filter(c=>c.owner==="織田")}
function doDomesticAction(type){
if(g.used||g.over)return;
let c=g.cities[g.selected];
if(c.owner!=="織田")return;
let o=officer(c.officer);
let bonus=1+Math.max(0,o.p-60)/200;
if(type==="farm"){
if(g.gold<300)return alert("金錢不足");
g.gold-=300;c.farm++;log(c.name+"開墾農田");
}
if(type==="trade"){
if(g.gold<350)return alert("金錢不足");
g.gold-=350;c.trade++;log(c.name+"發展商業");
}
if(type==="def"){
if(g.gold<250)return alert("金錢不足");
g.gold-=250;c.def=Math.min(100,c.def+12*bonus);
log(c.name+"修築城防");
}
if(type==="recruit"){
if(g.gold<400||g.rice<300)return alert("資源不足");
g.gold-=400;g.rice-=300;c.troops+=Math.round(500*bonus);
log(c.name+"徵募足輕");
}
g.used=true;save();render();
}
function appoint(){
if(g.used||g.over)return;
let c=g.cities[g.selected];
if(c.owner!=="織田")return;
let id=Number(document.getElementById("officers").value);
let taken=g.cities.some(x=>x.id!==c.id&&x.officer===id);
let o=officer(id);
if(!o||o.f!=="織田"||taken)return;
c.officer=id;g.used=true;
log(o.n+"就任"+c.name+"城主");
save();render();
}
function fight(a,b,n){
let x=g.cities[a],y=g.cities[b];
if(!x||!y||x.owner===y.owner||!nearby(a).includes(b))return;
n=Math.min(n,x.troops);
if(n<100)return;
let o=officer(x.officer),d=officer(y.officer);
let attack=n*(0.8+o.c/200)*(0.85+Math.random()*0.3);
if(o.t==="鬼柴田")attack*=1.15;
let defense=y.troops*(0.8+d.c/250)*(1+y.def/200)*(0.85+Math.random()*0.3);
x.troops-=n;
if(attack>defense){
let former=y.owner;
y.owner=x.owner;
y.troops=Math.max(100,Math.round(n*0.45));
y.def=Math.max(20,y.def-20);
y.officer=x.officer;
log(o.n+"攻陷"+y.name+"！原屬"+former+"家");
}else{
y.troops=Math.max(100,Math.round(y.troops*0.7));
log(o.n+"進攻"+y.name+"失敗");
}
}
function march(){
if(g.used||g.over)return;
let a=g.selected,c=g.cities[a];
if(c.owner!=="織田")return;
let b=Number(document.getElementById("target").value);
if(!nearby(a).includes(b)||g.cities[b].owner==="織田")return;
if(g.rice<500)return alert("兵糧不足");
if(c.troops<300)return alert("兵力不足");
g.rice-=500;
fight(a,b,Math.floor(c.troops*0.65));
g.used=true;check();save();render();
}
function ai(){
for(let owner of ["齋藤","今川"]){
for(let c of g.cities.filter(x=>x.owner===owner)){
c.troops+=180;
let enemies=nearby(c.id).map(i=>g.cities[i]).filter(x=>x.owner!==owner);
if(enemies.length&&c.troops>enemies[0].troops*1.8&&Math.random()<0.4){
fight(c.id,enemies[0].id,Math.floor(c.troops*0.6));
}
}
}
}
function check(){
if(!own().length){g.over=true;log("織田家滅亡，遊戲結束");}
else if(g.cities.every(c=>c.owner==="織田")){
g.over=true;log("天下統一！織田家獲得勝利！");
}
}
function nextTurn(){
if(g.over)return;
for(let c of own()){
let o=officer(c.officer);
let bonus=1+Math.max(0,o.p-60)/200;
g.gold+=Math.round(c.trade*180*bonus);
g.rice+=Math.round(c.farm*550*bonus)-Math.ceil(c.troops/10);
}
g.rice=Math.max(0,g.rice);
ai();g.turn++;g.used=false;check();
log("進入第"+g.turn+"回合");
save();render();
}
function reset(){
if(confirm("確定重新開始遊戲？")){
g=fresh();save();render();
}
}
function render(){
let c=g.cities[g.selected],o=officer(c.officer);
let enemies=nearby(c.id).map(i=>g.cities[i]).filter(x=>x.owner!=="織田");
let choices=OFFICERS.filter(x=>x.f==="織田"&&!g.cities.some(y=>y.id!==c.id&&y.officer===x.id));
let season=["春","夏","秋","冬"][(g.turn-1)%4];
let year=1560+Math.floor((g.turn-1)/4);
document.getElementById("game").innerHTML=`
<div class="stats">
<div class="stat">軍資金<b>${g.gold}</b></div>
<div class="stat">兵糧<b>${g.rice}</b></div>
<div class="stat">回合<b>${g.turn}</b></div>
</div>
<section class="panel">
<h2>${year}年 ${season} · 戰略地圖</h2>
<div class="map">
${g.cities.map(x=>`
<button class="castle ${x.owner==="織田"?"":"enemy"} ${x.id===g.selected?"active":""}"
onclick="selectCity(${x.id})">
<strong>${x.name}</strong>
<span>${x.owner}家 · ${x.troops}兵</span>
</button>`).join("")}
</div>
</section>
<section class="panel">
<h2>🏯 ${c.name}城</h2>
<p>勢力：${c.owner}家　兵力：${c.troops}</p>
<p>城防：${Math.round(c.def)}　農業：${c.farm}　商業：${c.trade}</p>
<div class="officer">
<b>⚔ ${o.n}</b>
<p>統率 ${o.c}｜武勇 ${o.w}</p>
<p>智略 ${o.i}｜政治 ${o.p}</p>
<small>固有特性：${o.t}</small>
</div>
${c.owner==="織田"&&!g.over?`
<h2>內政指令</h2>
<div class="actions">
<button onclick="doDomesticAction('farm')" ${g.used?"disabled":""}>開墾 300金</button>
<button onclick="doDomesticAction('trade')" ${g.used?"disabled":""}>商業 350金</button>
<button onclick="doDomesticAction('def')" ${g.used?"disabled":""}>築城 250金</button>
<button onclick="doDomesticAction('recruit')" ${g.used?"disabled":""}>徵兵 400金</button>
</div>
<h2 style="margin-top:18px">武將任命</h2>
<select id="officers">
${choices.map(x=>`<option value="${x.id}" ${x.id===c.officer?"selected":""}>${x.n}｜統率${x.c} 政治${x.p}</option>`).join("")}
</select>
<button class="full" onclick="appoint()" ${g.used?"disabled":""}>任命城主</button>
<h2 style="margin-top:18px">軍事出征</h2>
${enemies.length?`
<select id="target">
${enemies.map(x=>`<option value="${x.id}">${x.name}｜${x.troops}兵</option>`).join("")}
</select>
<button class="full" onclick="march()" ${g.used?"disabled":""}>⚔ 出征（500兵糧）</button>
`:"<p>周圍沒有可進攻的敵城。</p>"}
`:"<p class='notice'>此城目前不屬於織田家。</p>"}
</section>
<section class="panel">
<h2>📜 戰國紀事</h2>
<div class="log">${g.logs.map(x=>`<div>• ${x}</div>`).join("")}</div>
</section>
${g.over?`<section class="panel"><h2>${own().length?"🎉 統一成功":"💀 遊戲結束"}</h2></section>`:""}
<button class="full" onclick="nextTurn()" ${g.over?"disabled":""}>結束回合 →</button>
<button class="full" onclick="reset()">重新開始</button>
<p class="notice">V0.2 測試版 · 自動儲存於本機 Safari</p>
`;
}
load();
</script>
</body>
</html>
